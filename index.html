<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Darrere el drac</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎥</text></svg>">
<meta name="description" content="Un documental de David González i Joan Clusella">
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1f1d1a;--mut:#6d675d;--ac:#b4471f;--bd:#e2ddd2;--ok:#2e9e5b;--warn:#c47b1f;--err:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#1b1a18;--card:#262421;--tx:#f0ece4;--mut:#a39c8f;--ac:#e47a4f;--bd:#3a3733;--ok:#3fbf75;--warn:#e0a63c;--err:#e26a5c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:20px 20px 8px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
h1{margin:0;font:700 26px/1.2 Georgia,serif}
.byline{color:var(--mut);font-size:13px;font-style:italic;margin-top:2px}
.sub{color:var(--ok);font-size:14px;min-height:20px}
nav{display:flex;gap:8px;overflow-x:auto;padding:12px 20px;border-bottom:1px solid var(--bd)}
nav button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:999px;cursor:pointer;font:inherit;font-size:14px}
nav button.on{background:var(--ac);border-color:var(--ac);color:#fff}
main{max-width:1100px;margin:0 auto;padding:20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px;margin-bottom:16px}
h2{margin:0 0 10px;font:700 20px Georgia,serif}
h3{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.notes{white-space:pre-wrap}
.task{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.task:last-child{border:0}
.task.done span{text-decoration:line-through;color:var(--mut)}
.task-notes{width:100%;background:rgba(180,71,31,.05);border-left:3px solid var(--ac);padding:6px 10px;border-radius:4px;font-size:12px;color:var(--mut);white-space:pre-wrap;margin-top:4px;font-style:italic}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--ac)}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=time],textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px}
textarea{min-height:120px;resize:vertical}
select,input[type=date]{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:6px}
input[type=time]{padding:6px;width:auto}
.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:7px 12px;border-radius:8px;cursor:pointer;font:inherit;font-size:14px}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.d{color:var(--err)}
.btn.s{padding:3px 8px;font-size:13px}
.btn.email{background:#2f6f8f;border-color:#2f6f8f;color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.x{margin-left:auto;background:none;border:0;color:var(--mut);cursor:pointer;font-size:18px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{font-size:12px;color:var(--mut);text-align:center}
.cell{min-height:78px;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:4px;overflow:hidden;position:relative}
.cell.e{background:none;border:0}
.cell.blocked{background:rgba(192,57,43,.12);border-color:var(--err)}
.cell .lock{position:absolute;top:2px;right:4px;font-size:14px;cursor:pointer;opacity:.6}
.cell .lock:hover{opacity:1}
.dn{font-size:12px;color:var(--mut)}
.chip{font-size:11px;line-height:1.3;padding:2px 6px;border-radius:5px;margin-top:3px;color:#fff;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;max-width:100%}
.cell .chip{display:block}
.chip.done{opacity:.5;text-decoration:line-through}
.k0{background:#b4471f}.k1{background:#2f6f8f}.k2{background:#7a5aa6}.k3{background:#3d8b5f}.k4{background:#7d776b}
.k5{background:#a0522d}.k6{background:#5c7a3a}.k7{background:#8f4a6b}.k8{background:#4a4a4a}
.tag{font-size:12px;color:#fff;padding:1px 8px;border-radius:999px;margin-left:auto;white-space:nowrap}
.pp{font-size:12px;color:var(--mut);white-space:nowrap}
.badge{font-size:12px;color:var(--mut)}
#login{max-width:340px;margin:12vh auto;padding:20px}
#login h1{font-size:24px}
#login input{margin-bottom:10px}
#err{color:var(--err);font-size:14px;min-height:20px}
.agenda-item{display:grid;grid-template-columns:120px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd);cursor:pointer}
.agenda-item:last-child{border-bottom:0}
.agenda-item:hover{background:rgba(180,71,31,.05)}
.agenda-when{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.agenda-when .hr{color:var(--ac);font-weight:700}
.agenda-title{font-size:14px}
.agenda-who{font-size:12px;color:var(--mut);white-space:nowrap}
.agenda-empty{color:var(--mut);font-size:13px;padding:6px 0}
.agenda-chip{font-size:11px;padding:2px 8px;border-radius:999px;color:#fff;white-space:nowrap}
.bud-list{width:100%;font-size:14px}

.bud-row{display:grid;grid-template-columns:28px 1fr 130px 110px 110px 100px 32px;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd);align-items:center}

.bud-row .bc-x{text-align:center}
.caret{background:none;border:0;color:var(--mut);cursor:pointer;font-size:14px;padding:0 6px;transition:transform .15s;display:inline-block}

.st-pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;color:#fff;white-space:nowrap}
.st-pendent{background:#a39c8f}
.st-aprovat{background:#2f6f8f}
.st-pagat{background:#2e9e5b}
.exp-box{padding:10px 10px 12px 40px;background:var(--bg);border-bottom:1px solid var(--bd)}

.exp-item:last-of-type{border:0}
.exp-date{color:var(--mut);font-variant-numeric:tabular-nums;min-width:70px}
.exp-name{flex:1}
.exp-amt{font-variant-numeric:tabular-nums;font-weight:600;min-width:80px;text-align:right}
.exp-add{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.exp-add input{padding:5px 8px;font-size:13px}
.exp-add input.d{max-width:140px}
.exp-add input.a{max-width:110px}
.exp-add input.t{flex:1;min-width:140px}
.summary{display:grid;grid-template-columns:1fr auto;gap:6px 16px;font-variant-numeric:tabular-nums}
.summary .lbl{color:var(--mut)}
.summary .val{font-weight:600;text-align:right;white-space:nowrap}
.summary .big{font-size:18px;font-weight:700}
.summary .pos{color:var(--err)}
.summary .neg{color:var(--ok)}
.files-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-top:12px}
.file-card{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px}
.file-thumb{width:100%;height:120px;object-fit:cover;border-radius:6px;background:var(--card)}
.file-icon{width:100%;height:120px;display:flex;align-items:center;justify-content:center;font-size:48px;background:var(--card);border-radius:6px}
.file-name{font-size:12px;word-break:break-word;line-height:1.3;max-height:2.6em;overflow:hidden;text-overflow:ellipsis}
.file-size{font-size:11px;color:var(--mut)}
.file-actions{display:flex;gap:6px;margin-top:auto;flex-wrap:wrap}
.file-actions .btn{flex:1;padding:4px 6px;font-size:12px;text-align:center;min-width:60px}
.file-actions .btn.d{flex:0 0 auto}
audio{width:100%;height:32px;margin-top:4px}
.rich-editor{width:100%;min-height:400px;font:15px/1.7 Georgia,serif;padding:16px;background:var(--bg);border:1px solid var(--bd);border-radius:8px;color:var(--tx);outline:none}
.rich-editor:focus{outline:2px solid var(--ac);outline-offset:-2px}
.rich-toolbar{display:flex;gap:4px;flex-wrap:wrap;padding:8px;background:var(--bg);border:1px solid var(--bd);border-radius:8px;margin-bottom:8px}
.rich-toolbar button{background:var(--card);border:1px solid var(--bd);color:var(--tx);padding:4px 8px;border-radius:4px;cursor:pointer;font-size:14px;min-width:32px}
.rich-toolbar button:hover{background:var(--ac);color:#fff;border-color:var(--ac)}
.rich-editor h1,.rich-editor h2,.rich-editor h3{margin:12px 0 6px}
.rich-editor p{margin:6px 0}
.rich-editor ul,.rich-editor ol{margin:6px 0 6px 24px}
.rich-editor blockquote{border-left:3px solid var(--bd);padding-left:12px;margin:8px 0;color:var(--mut)}
.editor-save{font-size:12px;color:var(--ok);min-height:16px;text-align:right;margin-top:6px}
.people-checks{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:6px 0}
.people-checks label{display:flex;align-items:center;gap:5px;font-size:13px;cursor:pointer;padding:3px 8px;border-radius:6px;background:var(--bg);border:1px solid var(--bd)}
.people-checks label.checked{background:rgba(180,71,31,.1);border-color:var(--ac);color:var(--ac);font-weight:600}
.search-wrap{position:relative;flex:1;max-width:400px;margin:0 10px}
.search-input{width:100%;padding:8px 12px 8px 34px;border-radius:999px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-size:14px}
.search-input:focus{outline:2px solid var(--ac);outline-offset:-2px}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mut);pointer-events:none}
.search-results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--card);border:1px solid var(--bd);border-radius:10px;max-height:500px;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:100;display:none}
.search-results.open{display:block}
.search-result{padding:10px 14px;border-bottom:1px solid var(--bd);cursor:pointer;font-size:14px}
.search-result:last-child{border:0}
.search-result:hover{background:rgba(180,71,31,.06)}
.search-result .title{font-weight:600;margin-bottom:2px}
.search-result .meta{font-size:11px;color:var(--mut)}
.search-group{padding:8px 14px 4px;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;background:var(--bg);font-weight:600}
.search-empty{padding:14px;color:var(--mut);font-size:13px;text-align:center}

/* GANTT */
.gantt-wrap{overflow-x:auto;border:1px solid var(--bd);border-radius:8px;background:var(--card)}
.gantt{display:grid;font-size:12px}
.gantt-row{display:contents}
.gantt-label{padding:6px 10px;border-bottom:1px solid var(--bd);border-right:1px solid var(--bd);background:var(--card);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:sticky;left:0;z-index:2}
.gantt-cell{padding:0;border-bottom:1px solid var(--bd);border-right:1px solid var(--bd);height:28px;position:relative;background:var(--card)}
.gantt-head{background:var(--bg);font-weight:600;text-align:center;padding:6px 2px;border-bottom:2px solid var(--bd);border-right:1px solid var(--bd);font-size:11px;color:var(--mut)}
.gantt-head.month{border-left:2px solid var(--bd)}
.gantt-bar{position:absolute;top:3px;height:22px;border-radius:4px;color:#fff;font-size:11px;line-height:22px;padding:0 6px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gantt-bar.done{opacity:.5}
.gantt-today{background:rgba(180,71,31,.08)}
</style>
</head>
<body>
<div id="login" hidden>
  <h1>Darrere el drac</h1>
  <div class="byline">Un documental de David González i Joan Clusella</div>

</div>
<div id="ui" hidden>
  <header>
    <div style="flex:none">
      <h1>Darrere el drac</h1>
      <div class="byline">Un documental de David González i Joan Clusella</div>
      <div class="sub" id="who"></div>
    </div>
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" class="search-input" id="search-input" placeholder="Cercar tasques, documents, fitxers..." autocomplete="off">

    </div>
    <button class="btn" id="out">Sortir</button>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// =============================================
const SUPABASE_URL = 'https://edmppcurmxlbjeiigacw.supabase.co';
const SUPABASE_KEY = 'sb_publishable_RIXMNmjl2gvoJjnPVFgi8Q_fkMXYe3x';
// =============================================

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = s => document.querySelector(s);
const el = (t, p = {}, k = []) => { const e = document.createElement(t); for (const a in p) { if (a === 'class') e.className = p[a]; else if (a.startsWith('on')) e.addEventListener(a.slice(2), p[a]); else e[a] = p[a]; } [].concat(k).forEach(c => e.append(c)); return e; };
const KINDS = ['Guió', 'Preproducció', 'Entrevista', 'Rodatge', 'Postproducció', 'Producció', 'Pressupost', 'Distribució', 'Altres'];

const stClass = s => 'st-' + (s || 'pendent');

const fmt = d => d.split('-').reverse().slice(0, 2).join('/');
const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const eur = n => (Number(n) || 0).toLocaleString('ca-ES', { minimumFractionDigits: 0, maximumFractionDigits: 2 }) + ' €';
const realOf = p => (p.exp || []).reduce((a, e) => a + (Number(e.a) || 0), 0);
const isBudgetSec = s => /pressupost/i.test(s.name);
const isOverviewSec = s => /visi[oó]\s*general/i.test(s.name);
const dias = ['diumenge','dilluns','dimarts','dimecres','dijous','divendres','dissabte'];
const diasCurts = ['Dl','Dt','Dc','Dj','Dv','Ds','Dg'];
const mesos = ['gener','febrer','març','abril','maig','juny','juliol','agost','setembre','octubre','novembre','desembre'];
const diaLabel = d => { const dt = new Date(d + 'T00:00:00'); return dias[dt.getDay()]; };
const humanSize = b => { if (!b) return '0 B'; const u = ['B','KB','MB','GB']; const i = Math.floor(Math.log(b) / Math.log(1024)); return (b / Math.pow(1024, i)).toFixed(1) + ' ' + u[i]; };
let blockedDays = {};
let docs = [];
let currentDoc = null;
const FOLDERS = ['Guió', 'Notes', 'Entrevistes', 'Producció', 'Altres'];

const tasquesPersones = k => {
  if (!k.p) return [];
  if (Array.isArray(k.p)) return k.p.filter(x => x);
  return [k.p];
};
const setTasquesPersones = (k, arr) => { k.p = arr.length ? arr : null; };

// Retorna [inici, fi] d'una tasca (YYYY-MM-DD)
const rangTasca = k => {
  if (!k.d) return null;
  const inici = k.d;
  const fi = k.df && k.df >= k.d ? k.df : k.d;
  return [inici, fi];
};

const PARTIDES_INICIALS = [
  {c:"Direcció",cat:"Personal intern",p:0,st:"pendent",exp:[]},

];

let secs = [], people = [
  {name:'Joan', email:'joanclusella69@gmail.com'},
  {name:'David', email:''},
  {name:'Ferran', email:''},
  {name:'Javi', email:''},
  {name:'Diego', email:''}
], cur = 'cal', editing = false, me = '', peers = {}, pch = null;
let openBud = {}, cal = (() => { const n = new Date(); return { y: n.getFullYear(), m: n.getMonth() }; })();
const timers = {};
const peopleNames = () => people.map(p => typeof p === 'string' ? p : p.name);

function save(s) {
  if (!s || !s.id) return;
  clearTimeout(timers[s.id]);
  timers[s.id] = setTimeout(async () => {
    const payload = { id: s.id, pos: s.pos, name: s.name, notes: s.notes || '', tasks: s.tasks || [], budget: s.budget || [], files: s.files || [], text: s.text || '' };

    if (r.error) console.error('Error guardant:', r.error);
  }, 500);
}

const nm = e => e.split('@')[0];
const others = id => Object.entries(peers).filter(([k, v]) => k !== me && v.some(x => x.sec === id)).map(([k]) => nm(k));
function goto(id) { cur = id; render(); if (pch) pch.track({ sec: id }); }
function paintNav() {

  if (editing) n.append(el('button', { textContent: '+ Secció', onclick: addSec }));

async function toggleBlock(day) {
  if (blockedDays[day]) {
    if (!confirm('Desbloquejar el dia ' + fmt(day) + '?')) return;
    const r = await db.from('blocks').delete().eq('day', day);
    if (r.error) { alert('Error: ' + r.error.message); return; }
    delete blockedDays[day];
  } else {
    if (!confirm('Bloquejar el dia ' + fmt(day) + '? No es podran afegir tasques.')) return;
    const r = await db.from('blocks').insert({ day: day, created_by: me });
    if (r.error) { alert('Error: ' + r.error.message); return; }
    blockedDays[day] = true;
  }
  render();
}

function dataRelativa(isoStr) {
  if (!isoStr) return '—';
  const d = new Date(isoStr);
  const now = new Date();
  const diffMs = now - d;
  const diffMin = Math.floor(diffMs / 60000);
  const diffH = Math.floor(diffMin / 60);
  const diffD = Math.floor(diffH / 24);
  if (diffMin < 1) return 'ara mateix';
  if (diffMin < 60) return 'fa ' + diffMin + ' min';
  if (diffH < 24) return 'fa ' + diffH + ' h';
  if (diffD === 1) return 'ahir';
  if (diffD < 7) return 'fa ' + diffD + ' dies';
  return d.toLocaleDateString('ca-ES');
}

// ==================== ENVIAR CONVOCATÒRIA ====================
async function enviaConvocatoria(k, s) {
  const persons = tasquesPersones(k);
  if (!persons.length) { alert('Aquesta tasca no té cap persona assignada.'); return; }
  const emails = [];
  const senseCorreu = [];
  persons.forEach(n => {
    const p = people.find(x => (typeof x === 'string' ? x : x.name) === n);
    if (!p) { senseCorreu.push(n); return; }
    const mail = typeof p === 'string' ? '' : (p.email || '');
    if (!mail) { senseCorreu.push(n); return; }
    emails.push(mail);
  });
  if (!emails.length) {
    alert('Cap de les persones assignades té correu electrònic configurat.\n\nVes a "Editar" → "Persones de l\'equip" i afegeix els seus correus.');
    return;
  }
  const teData = !!k.d;
  let msg = 'Enviar convocatòria a:\n\n' + persons.map((n, i) => '  • ' + n + (emails[i] ? ' <' + emails[i] + '>' : '')).join('\n');
  msg += '\n\nEsdeveniment: ' + (k.t || '(sense títol)');
  msg += '\nData: ' + (teData ? fmt(k.d) + (k.h ? ' a les ' + k.h : '') : '(sense data)');
  if (senseCorreu.length) msg += '\n\n⚠️ Sense correu: ' + senseCorreu.join(', ');
  msg += '\n\nContinuar?';
  if (!confirm(msg)) return;
  try {
    const { data: { session } } = await db.auth.getSession();
    const [y, m, d] = (k.d || '0000-00-00').split('-');
    const dateFormatted = k.d ? (d + '/' + m + '/' + y) : 'Sense data';
    const response = await fetch(SUPABASE_URL + '/functions/v1/smart-handler', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + (session ? session.access_token : SUPABASE_KEY),
        'apikey': SUPABASE_KEY
      },
      body: JSON.stringify({
        mode: 'send-email',
        recipients: emails,
        event: {
          title: k.t || 'Esdeveniment',
          date: k.d || '',
          dateFormatted: dateFormatted,
          time: k.h || '',
          location: '',
          description: 'Secció: ' + s.name + '\nTipus: ' + (k.k || 'Altres') + '\nPersones: ' + persons.join(', '),
          notes: (k.n || '').trim(),
          sectionNotes: (s.notes || '').trim(),
          createdBy: me
        }
      })
    });
    if (!response.ok) {
      const errText = await response.text();
      alert('Error enviant: ' + response.status + '\n\n' + errText.substring(0, 300));
      return;
    }
    const result = await response.json();
    if (result.error) { alert('Error: ' + result.error); return; }
    alert('✅ Convocatòria enviada a ' + emails.join(', '));
  } catch (e) {
    console.error(e);
    alert('Error inesperat: ' + e.message);
  }
}

function fileKind(mime, name) {
  if (!mime && name) mime = name.split('.').pop().toLowerCase();
  if (typeof mime === 'string') {
    if (mime.startsWith('image/')) return 'image';
    if (mime.startsWith('audio/')) return 'audio';
    if (mime.startsWith('video/')) return 'video';
    if (mime === 'application/pdf' || mime === 'pdf') return 'pdf';
    if (mime.includes('word') || mime === 'doc' || mime === 'docx') return 'doc';
  }
  return 'file';
}
function fileIcon(kind) {
  return { image: '🖼️', audio: '🎵', video: '🎬', pdf: '📄', doc: '📝', file: '📎' }[kind] || '📎';
}
function renderFiles(s) {

    el('button', { class: 'btn p', textContent: '+ Pujar fitxer', onclick: () => pujaFitxer(s) })
  ]));
  if (!s.files.length) {
    card.append(el('div', { class: 'badge', textContent: 'Cap fitxer pujat encara.' }));
    return card;
  }
  const grid = el('div', { class: 'files-grid' });
  s.files.forEach((f, i) => {
    const kind = fileKind(f.mime, f.name);
    const fileCard = el('div', { class: 'file-card' });
    if (kind === 'image') {
      fileCard.append(el('img', { class: 'file-thumb', src: f.url, alt: f.name, loading: 'lazy' }));
    } else {
      fileCard.append(el('div', { class: 'file-icon', textContent: fileIcon(kind) }));
    }
    fileCard.append(el('div', { class: 'file-name', textContent: f.name, title: f.name }));
    fileCard.append(el('div', { class: 'file-size', textContent: humanSize(f.size) }));
    if (kind === 'audio') {
      const audio = el('audio', { controls: true, preload: 'metadata', id: 'audio-' + i });
      audio.src = f.url;
      fileCard.append(audio);
      // Time codes clicables (si ja s'ha transcrit abans)
      if (f.utterances && f.utterances.length) {
        const uList = el('div', { style: 'max-height:180px;overflow-y:auto;background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:6px;margin-top:6px;font-size:11px' });
        f.utterances.forEach(u => {
          const line = el('div', { style: 'padding:2px 0;cursor:pointer;line-height:1.4' });
          line.addEventListener('mouseenter', () => line.style.background = 'rgba(180,71,31,.08)');
          line.addEventListener('mouseleave', () => line.style.background = 'transparent');
          line.append(el('span', { style: 'color:var(--ac);font-weight:600;margin-right:6px', textContent: '[' + u.time + ']' }));
          line.append(el('span', { style: 'color:var(--mut);margin-right:6px', textContent: u.speaker ? '[P' + u.speaker + ']' : '' }));
          line.append(el('span', { textContent: u.text }));
          line.addEventListener('click', () => {
            const a = document.getElementById('audio-' + i);
            if (a) { a.currentTime = (u.start || 0) / 1000; a.play(); }
          });
          uList.append(line);
        });
        fileCard.append(uList);
      }
    }
    const actions = el('div', { class: 'file-actions' });
    actions.append(el('button', { class: 'btn', textContent: 'Obrir', style: 'flex:1', onclick: () => obreFitxer(f) }));
    if (kind === 'audio') {
      actions.append(el('button', { class: 'btn', textContent: '🎤 Transcriure', style: 'flex:1', onclick: () => transcriuAudio(f, s) }));
    }
    actions.append(el('button', { class: 'btn d', textContent: '🗑️', title: 'Esborrar', onclick: () => esborraFitxer(s, i, f) }));
    fileCard.append(actions);
    grid.append(fileCard);
  });
  card.append(grid);
  return card;
}
async function pujaFitxer(s) {
  const input = el('input', { type: 'file', style: 'display:none' });
  input.addEventListener('change', async () => {
    const file = input.files[0];
    if (!file) return;
    if (file.size > 50 * 1024 * 1024) { alert('El fitxer és massa gran (màxim 50 MB).'); return; }
    const secName = s.name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'general';
    const timestamp = Date.now();
    const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
    const path = secName + '/' + timestamp + '-' + safeName;
    const bar = el('div', { class: 'card', style: 'text-align:center' }, el('div', { textContent: '⏳ Pujant...', style: 'font-weight:600' }));
    $('#app').prepend(bar);
    const { data, error } = await db.storage.from('adjunts').upload(path, file, { cacheControl: '3600', upsert: false });
    bar.remove();
    if (error) { console.error('Error pujant:', error); alert('Error pujant el fitxer: ' + error.message); return; }
    const { data: urlData } = db.storage.from('adjunts').getPublicUrl(path);
    s.files = s.files || [];
    s.files.push({ name: file.name, size: file.size, mime: file.type, path: path, url: urlData.publicUrl, uploaded: new Date().toISOString() });
    save(s); render();
  });
  input.click();
}
async function esborraFitxer(s, idx, f) {
  if (!confirm('Esborrar "' + f.name + '"? Aquesta acció no es pot desfer.')) return;
  if (f.path) {
    const r = await db.storage.from('adjunts').remove([f.path]);
    if (r.error) console.warn('No s\'ha pogut esborrar del Storage:', r.error.message);
  }
  s.files.splice(idx, 1);
  save(s); render();
}
async function obreFitxer(f) {
  if (!f.path) { window.open(f.url, '_blank'); return; }
  const { data, error } = await db.storage.from('adjunts').createSignedUrl(f.path, 3600);
  if (error) { alert('No s\'ha pogut obrir el fitxer: ' + error.message); return; }
  window.open(data.signedUrl, '_blank');
}

// ==================== TRANSCRIPCIÓ (amb time codes guardats) ====================
async function transcriuAudio(f, s) {
  if (!confirm('Vols transcriure aquest àudio amb IA? Això pot trigar uns minuts i consumirà crèdit d\'AssemblyAI.')) return;
  const btn = event && event.target ? event.target : null;
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Transcriure...'; }
  try {
    if (!f.path) { alert('No es pot accedir a l\'àudio.'); return; }
    const { data: urlData, error: urlError } = await db.storage.from('adjunts').createSignedUrl(f.path, 3600);
    if (urlError) { alert('Error generant URL: ' + urlError.message); return; }
    const { data: { session } } = await db.auth.getSession();
    const response = await fetch(SUPABASE_URL + '/functions/v1/smart-handler', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + (session ? session.access_token : SUPABASE_KEY),
        'apikey': SUPABASE_KEY
      },
      body: JSON.stringify({ mode: 'transcribe', audioUrl: urlData.signedUrl, languageCode: 'ca' })
    });
    if (!response.ok) {
      const errText = await response.text();
      alert('Error: ' + response.status + ' - ' + errText.substring(0, 200));
      return;
    }
    const result = await response.json();
    if (result.error) { alert('Error: ' + result.error); return; }
    if (!result.transcript) { alert('No s\'ha pogut obtenir la transcripció.'); return; }
    // Guarda les utterances al fitxer per als time codes clicables
    f.utterances = result.utterances || [];
    save(s);
    // Crea document a Entrevistes
    const title = 'Transcripció: ' + (f.name || 'àudio').replace(/\.[^.]+$/, '');
    const content = '<p>' + result.transcript.replace(/\n/g, '</p><p>') + '</p>';
    const nou = { folder: 'Entrevistes', title: title, content: content };
    const r = await db.from('documents').insert(nou).select().single();
    if (r.error) { alert('Error creant el document: ' + r.error.message); return; }
    docs.unshift(r.data);
    alert('✅ Transcripció completada! La trobaràs a Guió → carpeta Entrevistes:\n\n"' + title + '"');
    render();
  } catch (e) {
    console.error('Error transcripció:', e);
    alert('Error inesperat: ' + e.message);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '🎤 Transcriure'; }
  }
}

function renderGantt() {
  const app = $('#app'); app.innerHTML = '';

  // Recull totes les tasques amb data
  const tasques = [];
  secs.forEach(s => (s.tasks || []).forEach(k => {
    if (k.d && k.t && k.t.trim()) {
      const rang = rangTasca(k);
      tasques.push({ tasca: k, seccio: s, inici: rang[0], fi: rang[1] });
    }
  }));

  if (!tasques.length) {
    app.append(el('div', { class: 'card' }, el('div', { class: 'badge', textContent: 'Cap tasca amb data. Afegeix alguna tasca per veure el Gantt.' })));
    return;
  }

  // Rang: de la més antiga a la més nova
  tasques.sort((a, b) => a.inici < b.inici ? -1 : a.inici > b.inici ? 1 : 0);
  const primeraData = new Date(tasques[0].inici + 'T00:00:00');
  const ultimaData = new Date(tasques[tasques.length - 1].fi + 'T00:00:00');

  // Amplia 2 dies a cada costat per tenir context
  const inici = new Date(primeraData); inici.setDate(inici.getDate() - 2);
  const fi = new Date(ultimaData); fi.setDate(fi.getDate() + 2);

  // Dies totals
  const dies = [];
  const cursor = new Date(inici);
  while (cursor <= fi) {
    dies.push(new Date(cursor));
    cursor.setDate(cursor.getDate() + 1);
  }

  const minCol = 24; // amplada mínima per dia
  const totalCols = dies.length;

  const wrap = el('div', { class: 'card' });
  wrap.append(el('h2', { textContent: '📊 Diagrama de Gantt' }));
  wrap.append(el('div', { class: 'badge', style: 'margin-bottom:12px', textContent: 'Cada columna és 1 dia. Les barres representen les tasques. Clica una barra per anar-hi.' }));

  const gantt = el('div', { class: 'gantt', style: 'grid-template-columns:240px repeat(' + totalCols + ',minmax(' + minCol + 'px,1fr))' });

  // Fila de mesos
  let mesosCells = [el('div', { class: 'gantt-head', style: 'grid-column:1' })];
  let mesActual = -1;
  let countMes = 0;
  const mesCells = [];
  dies.forEach((d, idx) => {
    if (d.getMonth() !== mesActual) {
      if (countMes > 0) {
        mesCells.push({ span: countMes, text: mesos[mesActual] + ' ' + dies[idx-1].getFullYear() });
      }
      mesActual = d.getMonth();
      countMes = 1;
    } else {
      countMes++;
    }
  });
  if (countMes > 0) {
    mesCells.push({ span: countMes, text: mesos[mesActual] + ' ' + dies[dies.length-1].getFullYear() });
  }
  mesCells.forEach(m => {
    gantt.append(el('div', { class: 'gantt-head month', style: 'grid-column:span ' + m.span, textContent: m.text }));
  });

  // Fila de dies de la setmana
  gantt.append(el('div', { class: 'gantt-head', textContent: 'Tasca' }));
  dies.forEach(d => {
    const diaSetmana = (d.getDay() + 6) % 7; // 0=Dl, 6=Dg
    const label = String(d.getDate());
    gantt.append(el('div', { class: 'gantt-head' + (d.getDay() === 0 || d.getDay() === 6 ? ' weekend' : ''), textContent: label }));
  });

  // Files de tasques
  tasques.forEach(({ tasca, seccio, inici, fi }) => {
    const rowClass = tasca.done ? 'gantt-bar done' : 'gantt-bar';
    gantt.append(el('div', { class: 'gantt-label', title: (tasca.t || '') + ' — ' + seccio.name, textContent: tasca.t || '(sense títol)' }));

    // Calcula columnes
    const startIdx = dies.findIndex(d => iso(d) === inici);
    const endIdx = dies.findIndex(d => iso(d) === fi);
    const span = endIdx - startIdx + 1;

    for (let i = 0; i < totalCols; i++) {
      const d = dies[i];
      const isInRange = i >= startIdx && i <= endIdx;
      const cell = el('div', { class: 'gantt-cell' });
      if (iso(d) === iso(new Date())) cell.classList.add('gantt-today');
      if (isInRange && i === startIdx) {
        const persons = tasquesPersones(tasca);
        const label = (tasca.h ? tasca.h + ' ' : '') + (persons.length ? '👤 ' + persons.join(', ') : '');
        const bar = el('div', { class: rowClass + ' k' + ki(tasca), style: 'left:0;width:calc(100% * ' + span + ' + ' + (span-1) + 'px)', textContent: (tasca.t || '') + (label ? ' · ' + label : ''), onclick: () => goto(seccio.id) });
        cell.append(bar);
      }
      gantt.append(cell);
    }
  });

  const scroll = el('div', { class: 'gantt-wrap' });
  scroll.append(gantt);
  wrap.append(scroll);

  // Llegenda
  const llegenda = el('div', { class: 'row', style: 'margin-top:12px' });
  KINDS.forEach((n, i) => llegenda.append(el('span', { class: 'chip k' + i, textContent: n })));
  wrap.append(llegenda);

  app.append(wrap);
}

  wrap.append(list);

  const totalP = s.budget.reduce((a, p) => a + (Number(p.p) || 0), 0);
  const totalR = s.budget.reduce((a, p) => a + realOf(p), 0);
  const diff = totalR - totalP;
  const pendentPag = s.budget.filter(p => (p.st || 'pendent') !== 'pagat').reduce((a, p) => a + Math.max(0, (Number(p.p) || 0) - realOf(p)), 0);

  const sum = el('div', { class: 'summary', style: 'margin-top:16px;padding-top:14px;border-top:2px solid var(--bd)' });
  sum.append(el('div', { class: 'lbl', textContent: 'Total previst' }), el('div', { class: 'val big', textContent: eur(totalP) }));
  sum.append(el('div', { class: 'lbl', textContent: 'Total real' }), el('div', { class: 'val big', textContent: eur(totalR) }));
  sum.append(el('div', { class: 'lbl', textContent: 'Diferència (real − previst)' }), el('div', { class: 'val big ' + (diff > 0 ? 'pos' : diff < 0 ? 'neg' : ''), textContent: (diff > 0 ? '+' : '') + eur(diff) + (diff > 0 ? ' (excés)' : diff < 0 ? ' (estalvi)' : '') }));
  sum.append(el('div', { class: 'lbl', textContent: 'Pendent de pagar' }), el('div', { class: 'val', textContent: eur(pendentPag) }));
  wrap.append(sum);

  return wrap;
}

function renderCal() {
  const app = $('#app'); app.innerHTML = '';
  const by = {}; secs.forEach(s => (s.tasks || []).forEach(k => { if (k.d) (by[k.d] = by[k.d] || []).push({ k, s }); }));
  app.append(el('div', { class: 'row', style: 'align-items:center;justify-content:space-between;margin:0 0 12px' }, [
    el('button', { class: 'btn', textContent: '←', onclick: () => { cal.m--; if (cal.m < 0) { cal.m = 11; cal.y--; } render(); } }),
    el('strong', { textContent: new Date(cal.y, cal.m, 1).toLocaleDateString('ca', { month: 'long', year: 'numeric' }) }),
    el('button', { class: 'btn', textContent: '→', onclick: () => { cal.m++; if (cal.m > 11) { cal.m = 0; cal.y++; } render(); } })]));
  app.append(el('div', { class: 'badge', style: 'margin:0 0 8px', textContent: '💡 Clica el 🔓 d\'un dia per bloquejar-lo o desbloquejar-lo.' }));
  const g = el('div', { class: 'cal' });
  ['Dl', 'Dt', 'Dc', 'Dj', 'Dv', 'Ds', 'Dg'].forEach(d => g.append(el('div', { class: 'wd', textContent: d })));
  const off = (new Date(cal.y, cal.m, 1).getDay() + 6) % 7, dim = new Date(cal.y, cal.m + 1, 0).getDate();
  for (let i = 0; i < off; i++) g.append(el('div', { class: 'cell e' }));
  for (let d = 1; d <= dim; d++) {
    const key = cal.y + '-' + String(cal.m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
    const isBlocked = !!blockedDays[key];
    const c = el('div', { class: 'cell' + (isBlocked ? ' blocked' : '') });
    c.append(el('div', { class: 'dn', textContent: d }));
    c.append(el('span', { class: 'lock', title: isBlocked ? 'Desbloquejar' : 'Bloquejar', textContent: isBlocked ? '🔒' : '🔓', onclick: () => toggleBlock(key) }));
    (by[key] || []).forEach(({ k, s }) => c.append(el('div', { class: 'chip k' + ki(k) + (k.done ? ' done' : ''), textContent: (k.h ? k.h + ' ' : '') + (k.t || '(sense títol)'), title: s.name + ' · ' + (k.k || 'Altres') + ' · ' + tasquesPersones(k).join(', '), onclick: () => goto(s.id) })));
    g.append(c);
  }
  app.append(g);
  app.append(el('div', { class: 'row' }, KINDS.map((n, i) => el('span', { class: 'chip k' + i, textContent: n }))));
  const t0 = new Date(), today = iso(t0), wk = iso(new Date(t0.getFullYear(), t0.getMonth(), t0.getDate() + 6));
  const up = []; secs.forEach(s => (s.tasks || []).forEach(k => { if (k.d && !k.done && k.d >= today) up.push({ k, s }); }));
  up.sort((a, b) => a.k.d < b.k.d ? -1 : a.k.d > b.k.d ? 1 : 0);
  [['Aquesta setmana', up.filter(x => x.k.d <= wk)], ['Més endavant', up.filter(x => x.k.d > wk).slice(0, 10)]].forEach(([h, l]) => {
    const c = el('div', { class: 'card', style: 'margin-top:16px' }, el('h3', { textContent: h }));
    if (!l.length) c.append(el('div', { class: 'badge', textContent: 'Res pendent.' }));
    l.forEach(({ k, s }) => {
      const persons = tasquesPersones(k);
      c.append(el('div', { class: 'task', style: 'cursor:pointer', onclick: () => goto(s.id) }, [
        el('span', { class: 'pp', textContent: fmt(k.d) + (k.h ? ' ' + k.h : '') }),
        el('span', { textContent: k.t || '(sense títol)' }),
        el('span', { class: 'tag k' + ki(k), textContent: k.k || 'Altres' }),
        persons.length ? el('span', { class: 'pp', textContent: '👤 ' + persons.join(', ') }) : ''
      ]));
    });
    app.append(c);
  });
}

// ==================== CERCADOR ====================
function inicialitzaCercador() {
  const input = $('#search-input');
  const results = $('#search-results');
  if (!input || !results) return;

  input.addEventListener('input', () => {
    const q = input.value.trim().toLowerCase();
    if (q.length < 2) { results.classList.remove('open'); results.innerHTML = ''; return; }
    const found = cercaGlobal(q);
    mostraResultats(found);
  });

  input.addEventListener('focus', () => {
    if (input.value.trim().length >= 2) {
      const found = cercaGlobal(input.value.trim().toLowerCase());
      mostraResultats(found);
    }
  });

  document.addEventListener('click', (e) => {
    if (!e.target.closest('.search-wrap')) {
      results.classList.remove('open');
    }
  });
}

function cercaGlobal(q) {
  const resultats = { tasques: [], documents: [], fitxers: [] };

  secs.forEach(s => {
    (s.tasks || []).forEach(k => {
      const text = (k.t || '').toLowerCase();
      const cat = (k.k || '').toLowerCase();
      const persons = tasquesPersones(k).join(' ').toLowerCase();
      const notes = (k.n || '').toLowerCase();
      if (text.includes(q) || cat.includes(q) || persons.includes(q) || notes.includes(q)) {
        resultats.tasques.push({ tasca: k, seccio: s });
      }
    });
  });

  docs.forEach(d => {
    const title = (d.title || '').toLowerCase();
    const content = (d.content || '').toLowerCase().replace(/<[^>]+>/g, ' ');
    if (title.includes(q) || content.includes(q)) {
      resultats.documents.push(d);
    }
  });

  secs.forEach(s => {
    (s.files || []).forEach(f => {
      const name = (f.name || '').toLowerCase();
      if (name.includes(q)) {
        resultats.fitxers.push({ fitxer: f, seccio: s });
      }
    });
  });

  return resultats;
}

function mostraResultats(r) {
  const box = $('#search-results');
  box.innerHTML = '';

  const total = r.tasques.length + r.documents.length + r.fitxers.length;
  if (!total) {
    box.append(el('div', { class: 'search-empty', textContent: 'Cap resultat.' }));
    box.classList.add('open');
    return;
  }

  if (r.tasques.length) {
    box.append(el('div', { class: 'search-group', textContent: '📋 Tasques (' + r.tasques.length + ')' }));
    r.tasques.slice(0, 10).forEach(({ tasca, seccio }) => {
      const meta = [
        seccio.name,
        tasca.d ? fmt(tasca.d) : 'Sense data',
        tasquesPersones(tasca).join(', ')
      ].filter(Boolean).join(' · ');

      box.append(el('div', { class: 'search-result', onclick: () => {
        $('#search-results').classList.remove('open');
        $('#search-input').value = '';
        goto(seccio.id);
      }}, [
        el('div', { class: 'title', textContent: tasca.t || '(sense títol)' }),
        el('div', { class: 'meta', textContent: meta })
      ]));
    });
  }

  if (r.documents.length) {
    box.append(el('div', { class: 'search-group', textContent: '📚 Documents (' + r.documents.length + ')' }));
    r.documents.slice(0, 10).forEach(d => {
      const meta = [
        d.folder,
        'Actualitzat ' + dataRelativa(d.updated_at)
      ].filter(Boolean).join(' · ');

      box.append(el('div', { class: 'search-result', onclick: () => {
        $('#search-results').classList.remove('open');
        $('#search-input').value = '';
        currentDoc = d;
        goto(secs.find(x => /^gui[oó]$/i.test(x.name))?.id || 'cal');
      }}, [
        el('div', { class: 'title', textContent: d.title || 'Sense títol' }),
        el('div', { class: 'meta', textContent: meta })
      ]));
    });
  }

  if (r.fitxers.length) {
    box.append(el('div', { class: 'search-group', textContent: '📎 Fitxers (' + r.fitxers.length + ')' }));
    r.fitxers.slice(0, 10).forEach(({ fitxer, seccio }) => {
      const meta = [seccio.name, humanSize(fitxer.size)].filter(Boolean).join(' · ');
      box.append(el('div', { class: 'search-result', onclick: () => {
        $('#search-results').classList.remove('open');
        $('#search-input').value = '';
        goto(seccio.id);
      }}, [
        el('div', { class: 'title', textContent: fitxer.name || '(sense nom)' }),
        el('div', { class: 'meta', textContent: meta })
      ]));
    });
  }

  box.classList.add('open');
}
const busy = () => { const a = document.activeElement; return a && $('#app').contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName); };
async function start(user) {
  me = user.email;
  $('#login').hidden = true; $('#ui').hidden = false;
  const a = await db.from('sections').select('*').order('pos');
  if (a.error) { console.error('Error carregant:', a.error); alert('Error carregant dades.'); return; }
  secs = a.data || [];
  const b = await db.from('settings').select('people').eq('id', 1).maybeSingle();
  if (b.data) {
    if (Array.isArray(b.data.people) && b.data.people.length) {
      people = b.data.people.map(p => typeof p === 'string' ? { name: p, email: '' } : p);
    }
  }
  await carregaBlocks();
  await carregaDocs();
  cur = 'cal'; render();
  inicialitzaCercador();
  db.channel('canvis')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'sections' }, p => {
      if (p.eventType === 'DELETE') secs = secs.filter(x => x.id !== p.old.id);
      else { if (p.new.id === cur && busy()) return; const i = secs.findIndex(x => x.id === p.new.id); if (i < 0) secs.push(p.new); else Object.assign(secs[i], p.new); }
      secs.sort((x, y) => x.pos - y.pos); if (!busy()) render(); else paintNav();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'settings' }, p => {
      if (p.new && p.new.people) {
        people = (Array.isArray(p.new.people) ? p.new.people : []).map(x => typeof x === 'string' ? { name: x, email: '' } : x);
        if (!busy()) render();
      }
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'blocks' }, async () => { await carregaBlocks(); if (cur === 'cal' && !busy()) render(); })
    .subscribe();
  pch = db.channel('presencia', { config: { presence: { key: me } } });
  pch.on('presence', { event: 'sync' }, () => { peers = pch.presenceState(); paintNav(); })
     .subscribe(st => { if (st === 'SUBSCRIBED') pch.track({ sec: cur }); });
}
$('#go').onclick = async () => {
  const r = await db.auth.signInWithPassword({ email: $('#em').value.trim(), password: $('#pw').value });
  if (r.error) $('#err').textContent = 'Correu o contrasenya incorrectes.';
  else start(r.data.user);
};
$('#out').onclick = async () => { await db.auth.signOut(); location.reload(); };
(async () => {
  const { data } = await db.auth.getSession();
  if (data.session) start(data.session.user); else $('#login').hidden = false;
})();
