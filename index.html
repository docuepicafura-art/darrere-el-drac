<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Darrere el drac</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎥</text></svg>">
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1f1d1a;--mut:#6d675d;--ac:#b4471f;--bd:#e2ddd2;--ok:#2e9e5b;--warn:#c47b1f;--err:#c0392b;--diet:#8a5a2b}
@media (prefers-color-scheme:dark){:root{--bg:#1b1a18;--card:#262421;--tx:#f0ece4;--mut:#a39c8f;--ac:#e47a4f;--bd:#3a3733;--ok:#3fbf75;--warn:#e0a63c;--err:#e26a5c;--diet:#c58b4e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:20px 20px 8px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
h1{margin:0;font:700 26px/1.2 Georgia,serif}
.byline{color:var(--mut);font-size:13px;font-style:italic;margin-top:2px}
.sub{color:var(--ok);font-size:14px;min-height:20px}
nav{display:flex;gap:8px;overflow-x:auto;padding:12px 20px;border-bottom:1px solid var(--bd)}
nav button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:999px;cursor:pointer;font:inherit;font-size:14px}
nav button.on{background:var(--ac);border-color:var(--ac);color:#fff}
main{max-width:1100px;margin:0 auto;padding:20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px;margin-bottom:16px}
h2{margin:0 0 10px;font:700 20px Georgia,serif}
h3{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.notes{white-space:pre-wrap}
.task{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.task:last-child{border:0}
.task.done span{text-decoration:line-through;color:var(--mut)}
.task-notes{width:100%;background:rgba(180,71,31,.05);border-left:3px solid var(--ac);padding:6px 10px;border-radius:4px;font-size:12px;color:var(--mut);white-space:pre-wrap;margin-top:4px;font-style:italic}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--ac)}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=time],input[type=url],textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px}
textarea{min-height:120px;resize:vertical}
select,input[type=date]{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:6px}
input[type=time]{padding:6px;width:auto}
.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:7px 12px;border-radius:8px;cursor:pointer;font:inherit;font-size:14px}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.d{color:var(--err)}
.btn.s{padding:3px 8px;font-size:13px}
.btn.email{background:#2f6f8f;border-color:#2f6f8f;color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.x{margin-left:auto;background:none;border:0;color:var(--mut);cursor:pointer;font-size:18px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{font-size:12px;color:var(--mut);text-align:center}
.cell{min-height:78px;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:4px;overflow:hidden;position:relative}
.cell.e{background:none;border:0}
.cell.blocked{background:rgba(192,57,43,.12);border-color:var(--err)}
.cell.today{border:2px solid var(--ac);background:rgba(180,71,31,.10)}
.cell.today .dn{color:var(--ac);font-weight:700}
.cell.today::after{content:'avui';position:absolute;bottom:2px;right:4px;font-size:9px;font-weight:700;color:var(--ac)}
.cell .lock{position:absolute;top:2px;right:4px;font-size:14px;cursor:pointer;opacity:.6}
.dn{font-size:12px;color:var(--mut)}
.chip{font-size:11px;line-height:1.3;padding:2px 6px;border-radius:5px;margin-top:3px;color:#fff;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;max-width:100%}
.cell .chip{display:block}
.chip.done{opacity:.5;text-decoration:line-through}
.k0{background:#b4471f}.k1{background:#2f6f8f}.k2{background:#7a5aa6}.k3{background:#3d8b5f}.k4{background:#7d776b}
.k5{background:#a0522d}.k6{background:#5c7a3a}.k7{background:#8f4a6b}.k8{background:#4a4a4a}
.chip.diet-chip{background:var(--diet);border-left:3px solid #5a3a17}
.tag{font-size:12px;color:#fff;padding:1px 8px;border-radius:999px;margin-left:auto;white-space:nowrap}
.pp{font-size:12px;color:var(--mut);white-space:nowrap}
.badge{font-size:12px;color:var(--mut)}
#login{max-width:340px;margin:12vh auto;padding:20px}
#login input{margin-bottom:10px}
#err{color:var(--err);font-size:14px;min-height:20px}
.agenda-item{display:grid;grid-template-columns:120px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd);cursor:pointer}
.agenda-when{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.agenda-when .hr{color:var(--ac);font-weight:700}
.agenda-title{font-size:14px}
.agenda-who{font-size:12px;color:var(--mut);white-space:nowrap}
.agenda-empty{color:var(--mut);font-size:13px;padding:6px 0}
.agenda-chip{font-size:11px;padding:2px 8px;border-radius:999px;color:#fff;white-space:nowrap}
.bud-list{width:100%;font-size:14px}
.bud-head{display:grid;grid-template-columns:36px 1fr 130px 110px 110px 100px 32px;gap:8px;padding:6px 0;border-bottom:2px solid var(--bd);font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);font-weight:600;align-items:center}
.bud-row{display:grid;grid-template-columns:36px 1fr 130px 110px 110px 100px 32px;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd);align-items:center}
.bud-row:hover{background:rgba(180,71,31,.05)}
.bud-row .bc-caret{text-align:center;display:flex;align-items:center;justify-content:center;gap:2px}
.bud-row .bc-num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.bud-row .bc-num.strong{font-weight:600}
.bud-row .bc-x{text-align:center}
.bud-row.dragging{opacity:.35}
.bud-row.drop-target{background:rgba(180,71,31,.10);box-shadow:inset 0 -2px 0 var(--ac)}
.drag-handle{display:inline-block;cursor:grab;color:var(--mut);font-size:14px;letter-spacing:-2px;padding:0 3px;user-select:none;line-height:1}
.drag-handle:hover{color:var(--ac)}
.caret{background:none;border:0;color:var(--mut);cursor:pointer;font-size:14px;padding:0 4px;transition:transform .15s}
.caret.open{transform:rotate(90deg)}
.cat-pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--bd);color:var(--mut)}
.st-pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;color:#fff}
.st-pendent{background:#a39c8f}.st-aprovat{background:#2f6f8f}.st-pagat{background:#2e9e5b}
.exp-box{padding:10px 10px 12px 40px;background:var(--bg);border-bottom:1px solid var(--bd)}
.exp-item{display:flex;gap:10px;align-items:center;padding:4px 0;border-bottom:1px dashed var(--bd)}
.exp-date{color:var(--mut);min-width:70px}
.exp-name{flex:1}
.exp-amt{font-weight:600;min-width:80px;text-align:right}
.summary{display:grid;grid-template-columns:1fr auto;gap:6px 16px}
.summary .lbl{color:var(--mut)}
.summary .val{font-weight:600;text-align:right}
.summary .big{font-size:18px;font-weight:700}
.summary .pos{color:var(--err)}
.summary .neg{color:var(--ok)}
.files-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:12px}
.file-card{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px}
.file-thumb{width:100%;height:120px;object-fit:cover;border-radius:6px}
.file-icon{width:100%;height:120px;display:flex;align-items:center;justify-content:center;font-size:48px;background:var(--card);border-radius:6px}
.file-name{font-size:12px;word-break:break-word}
.file-size{font-size:11px;color:var(--mut)}
.file-actions{display:flex;gap:6px;margin-top:auto;flex-wrap:wrap}
.file-actions .btn{flex:1;padding:4px 6px;font-size:12px;min-width:60px}
.rich-editor{width:100%;min-height:400px;font:15px/1.7 Georgia,serif;padding:16px;background:var(--bg);border:1px solid var(--bd);border-radius:8px;outline:none}
.rich-toolbar{display:flex;gap:4px;flex-wrap:wrap;padding:8px;background:var(--bg);border:1px solid var(--bd);border-radius:8px;margin-bottom:8px}
.rich-toolbar button{background:var(--card);border:1px solid var(--bd);padding:4px 8px;border-radius:4px;cursor:pointer;font-size:14px;min-width:32px}
.editor-save{font-size:12px;color:var(--ok);text-align:right;margin-top:6px}
.people-checks{display:flex;gap:12px;flex-wrap:wrap;padding:6px 0}
.people-checks label{display:flex;align-items:center;gap:5px;font-size:13px;padding:3px 8px;border-radius:6px;background:var(--bg);border:1px solid var(--bd)}
.people-checks label.checked{background:rgba(180,71,31,.1);border-color:var(--ac);color:var(--ac);font-weight:600}
.search-wrap{position:relative;flex:1;max-width:400px;margin:0 10px}
.search-input{width:100%;padding:8px 12px 8px 34px;border-radius:999px;border:1px solid var(--bd);background:var(--card);font:inherit;font-size:14px}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mut)}
.search-results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--card);border:1px solid var(--bd);border-radius:10px;max-height:500px;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:100;display:none}
.search-results.open{display:block}
.search-result{padding:10px 14px;border-bottom:1px solid var(--bd);cursor:pointer;font-size:14px}
.search-result .title{font-weight:600;margin-bottom:2px}
.search-result .meta{font-size:11px;color:var(--mut)}
.search-group{padding:8px 14px 4px;font-size:11px;color:var(--mut);text-transform:uppercase;background:var(--bg);font-weight:600}
.search-empty{padding:14px;color:var(--mut);font-size:13px;text-align:center}
.gantt-wrap{overflow-x:auto;border:1px solid var(--bd);border-radius:8px;background:var(--card)}
.gantt{display:grid;font-size:12px}
.gantt-label{padding:6px 10px;border-bottom:1px solid var(--bd);border-right:1px solid var(--bd);background:var(--card);font-weight:600;white-space:nowrap;position:sticky;left:0;z-index:2}
.gantt-cell{padding:0;border-bottom:1px solid var(--bd);border-right:1px solid var(--bd);height:28px;position:relative}
.gantt-head{background:var(--bg);font-weight:600;text-align:center;padding:6px 2px;border-bottom:2px solid var(--bd);border-right:1px solid var(--bd);font-size:11px;color:var(--mut)}
.gantt-head.month{border-left:2px solid var(--bd)}
.gantt-head.weekend{background:rgba(180,71,31,.06)}
.gantt-head.today{background:var(--ac);color:#fff}
.gantt-bar{position:absolute;top:3px;height:22px;border-radius:4px;color:#fff;font-size:11px;line-height:22px;padding:0 6px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gantt-bar.done{opacity:.5}
.gantt-bar.auto{outline:2px dashed rgba(255,255,255,.65);outline-offset:-2px}
.gantt-bar.diet-bar{background:var(--diet);outline:2px solid #5a3a17;outline-offset:-2px}
.gantt-today{background:rgba(180,71,31,.08)}
.audio-box{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:12px;display:flex;flex-direction:column;gap:6px}
.audio-label{font-size:12px;color:var(--mut);font-weight:600}
.audio-player{width:100%;height:40px}
.ts{background:rgba(180,71,31,.12);color:var(--ac);border-radius:4px;padding:1px 6px;font:600 13px/1.4 ui-monospace,monospace;cursor:pointer}
.ts:hover,.ts.active{background:var(--ac);color:#fff}
.mr-list{display:grid;grid-template-columns:1fr;gap:8px;margin-top:14px}
.mr-item{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:12px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.mr-item.selected{background:rgba(180,71,31,.08);border-color:var(--ac)}
.mr-item .t{font-weight:700;font-size:15px}
.mr-item .s{font-size:12px;color:var(--mut)}
.mr-item .ref{font:600 11px/1.3 ui-monospace,monospace;color:var(--ac)}
.mr-item .pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;color:#fff;margin:2px 4px 0 0}
.pill.ok{background:#2e9e5b}.pill.ko{background:#c0392b}.pill.warn{background:#c47b1f}.pill.override{background:#7a5aa6}.pill.unk{background:#a39c8f}
.mr-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.mr-form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut);font-weight:600}
.mr-form .full{grid-column:1/-1}
.mr-diag{margin-top:14px;padding:12px;border-radius:10px;background:var(--bg);border:1px solid var(--bd)}
.mr-diag h4{margin:0 0 6px;font-size:13px;text-transform:uppercase;color:var(--mut)}
.mr-override{margin-top:12px;padding:12px;border-radius:10px;background:rgba(122,90,166,.08);border:1px solid rgba(122,90,166,.35)}
.mr-report{font:12px/1.5 ui-monospace,monospace;white-space:pre-wrap;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:12px;margin-top:12px;max-height:420px;overflow:auto}
.mr-audit{font-size:11px;color:var(--mut);margin-top:10px;padding-top:8px;border-top:1px dashed var(--bd)}
.mr-select-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px 12px;margin-top:12px}
.img-toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
.img-toolbar input[type=text]{flex:1;min-width:180px}
.img-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-top:14px}
.img-card{background:var(--bg);border:1px solid var(--bd);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.img-thumb{width:100%;height:160px;object-fit:cover;background:var(--card);display:block}
.img-thumb-placeholder{width:100%;height:160px;display:flex;align-items:center;justify-content:center;font-size:44px;background:var(--card);color:var(--mut)}
.img-body{padding:10px;display:flex;flex-direction:column;gap:6px;flex:1}
.img-title{font-weight:700;font-size:14px;line-height:1.3}
.img-meta{font-size:11px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.img-actions{display:flex;gap:6px;margin-top:auto;flex-wrap:wrap}
.img-actions .btn{flex:1;padding:4px 6px;font-size:12px}
.img-import{background:var(--bg);border:1px dashed var(--bd);border-radius:10px;padding:14px;margin-top:12px}
.img-import textarea{width:100%;min-height:140px;font:13px/1.4 ui-monospace,monospace}
.img-pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;color:#fff}
.img-pill.ok{background:#2e9e5b}.img-pill.warn{background:#c47b1f}.img-pill.ko{background:#c0392b}.img-pill.unk{background:#a39c8f}
.cred-list{display:grid;grid-template-columns:1fr;gap:6px;margin-top:12px}
.cred-row{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.cred-row.dragging{opacity:.35}
.cred-row.drop-target{background:rgba(180,71,31,.10);box-shadow:inset 0 -2px 0 var(--ac)}
.cred-main{font-size:14px}
.cred-sub{font-size:11px;color:var(--mut)}
.cred-preview{font:13px/1.5 ui-monospace,monospace;white-space:pre-wrap;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:14px;margin-top:12px;max-height:520px;overflow:auto}
.cred-frase-bar{display:flex;gap:8px;align-items:center;background:rgba(180,71,31,.06);border:1px solid var(--bd);border-radius:8px;padding:8px 12px;margin-bottom:12px;flex-wrap:wrap}
.cred-frase-bar label{font-size:12px;color:var(--mut);font-weight:600;white-space:nowrap}
.cred-frase-bar input{flex:1;min-width:220px}
.budget-indicator{background:linear-gradient(90deg, rgba(180,71,31,.08), rgba(180,71,31,.03));border:1px solid var(--bd);border-left:4px solid var(--ac);border-radius:10px;padding:12px 16px;margin-bottom:14px}
.budget-indicator .b-title{font-weight:700;font-size:15px;margin-bottom:8px;color:var(--ac)}
.budget-indicator .b-stats{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;margin-bottom:8px}
.budget-indicator .b-stats span{font-variant-numeric:tabular-nums}
.budget-indicator .b-stats strong{font-weight:700}
.budget-indicator .b-bar{height:12px;background:var(--bg);border-radius:6px;overflow:hidden;position:relative}
.budget-indicator .b-bar-fill{height:100%;background:var(--ok);transition:width .3s}
.budget-indicator .b-bar-fill.warn{background:var(--warn)}
.budget-indicator .b-bar-fill.over{background:var(--err)}
.budget-indicator .b-pct{font-size:11px;color:var(--mut);margin-top:4px;text-align:right}
.budget-indicator .b-alert{color:var(--err);font-weight:700;font-size:13px;margin-top:6px}
.budget-badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:999px;background:rgba(180,71,31,.12);color:var(--ac);margin-left:8px;font-weight:600;white-space:nowrap}

/* JORNADES ESPECIALS */
.jorn-box{padding:12px 14px;background:rgba(122,90,166,.05);border-top:1px dashed var(--bd);border-bottom:1px solid var(--bd)}
.jorn-title{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.jorn-summary{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;margin-bottom:10px;padding:8px 10px;background:var(--bg);border-radius:8px;border:1px solid var(--bd)}
.jorn-summary .jorn-cobrat{color:var(--ok);font-weight:600}
.jorn-summary .jorn-pendent{color:var(--warn);font-weight:600}
.jorn-mes-head{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--bg);border:1px solid var(--bd);border-radius:8px;cursor:pointer;font-size:14px;margin-top:6px;user-select:none}
.jorn-mes-head:hover{background:rgba(180,71,31,.06)}
.jorn-mes-head.open{background:rgba(180,71,31,.10);border-color:var(--ac)}
.jorn-caret{font-size:10px;color:var(--mut);width:12px}
.jorn-mes-nom{font-weight:700;flex:1;text-transform:capitalize}
.jorn-mes-count{font-size:11px;color:var(--mut)}
.jorn-mes-total{font-variant-numeric:tabular-nums;font-weight:700}
.jorn-mes-cobrat{font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums}
.jorn-taula{margin:8px 0 4px 16px}
.jorn-row{display:grid;grid-template-columns:130px 60px 110px 160px 1fr 90px 50px 90px 50px 30px;gap:6px;align-items:center;padding:4px 0;border-bottom:1px solid var(--bd);font-size:13px}
.jorn-head{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);font-weight:600;border-bottom:2px solid var(--bd)}
.jorn-row.done .jorn-num{color:var(--tx) !important;opacity:1 !important}
.jorn-num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.jorn-chip{background:#7a5aa6 !important;border-left:3px solid #4a2f7a}
.gantt-bar-jornada{background:#7a5aa6;outline:2px solid #4a2f7a;outline-offset:-2px}

/* DIETES (sub-línia dins del pressupost, com les jornades) */
.diet-box{padding:12px 14px;background:rgba(138,90,43,.06);border-top:1px dashed var(--bd);border-bottom:1px solid var(--bd)}
.diet-title{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.diet-summary{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;margin-bottom:10px;padding:8px 10px;background:var(--bg);border-radius:8px;border:1px solid var(--bd)}
.diet-summary .diet-cobrat{color:var(--ok);font-weight:600}
.diet-summary .diet-pendent{color:var(--warn);font-weight:600}

const cur_ = () => secs.find(x => x.id === cur);

async function toggleBlock(day) {
  if (blockedDays[day]) {
    if (!confirm('Desbloquejar el dia ' + fmt(day) + '?')) return;
    const r = await db.from('blocks').delete().eq('day', day);
    if (r.error) { alert('Error: ' + r.error.message); return; }
    delete blockedDays[day];
  } else {
    if (!confirm('Bloquejar el dia ' + fmt(day) + '?')) return;
    const r = await db.from('blocks').insert({ day, created_by: me });
    if (r.error) { alert('Error: ' + r.error.message); return; }
    blockedDays[day] = true;
  }
  render();
}

const busy = () => { const a = document.activeElement; return a && $('#app').contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName); };

function calculaDretsSoundtrack() {
  const bsec = secs.find(s => isBudgetSec(s));
  if (!bsec || !bsec.budget) return { pressupostat: 0, gastat: 0, disponible: 0, pct: 0, pendent: 0, pagat: 0, existeix: false };
  const partida = bsec.budget.find(p => /soundtrack/i.test(p.c || ''));
  if (!partida) return { pressupostat: 0, gastat: 0, disponible: 0, pct: 0, pendent: 0, pagat: 0, existeix: false };
  const pressupostat = Number(partida.p) || 0;
  let pendent = 0, pagat = 0;
  musicRights.forEach(m => {
    const adq = m.adquisicio || 'cap';
    const imp = Number(m.adquisicio_import) || 0;
    if (adq === 'pagada') pagat += imp;
    else if (adq === 'negociada' || adq === 'cedida') pendent += imp;
  });
  const gastat = pendent + pagat;
  const disponible = pressupostat - gastat;
  const pct = pressupostat > 0 ? Math.round((gastat / pressupostat) * 100) : 0;
  return { pressupostat, gastat, disponible, pct, pendent, pagat, existeix: true };
}

function calcularDiagnosticoLegal(c) {
  const anyG = Number(c.ano_grabacion) || 0;
  const anyM = Number(c.ano_muerte_autor) || 0;
  const out = {};
  const ovE = c.override_europa || '';
  const ovM = c.override_mundial || '';
  const ovS = c.override_sgae || '';
  if (anyG > 0 && anyG <= (ANNO_ACTUAL - 70)) out.estat_master_europa = { ok: true, text: '🟢 DOMINI PÚBLIC A EUROPA (Cost 0€)', base: 'Gravació de fa més de 70 anys (≤ ' + (ANNO_ACTUAL-70) + ')' };
  else out.estat_master_europa = { ok: false, text: '🔴 MÀSTER COMERCIAL / PROTEGIT', base: anyG ? 'Gravació posterior a ' + (ANNO_ACTUAL-70) : 'Any de gravació no informat' };
  if (anyG > 0 && anyG < 1923) out.estat_master_mundial = { ok: true, text: '🟢 DOMINI PÚBLIC MUNDIAL (Cost 0€)', base: 'Anterior a 1923' };
  else out.estat_master_mundial = { ok: false, text: '🔴 REQUEREIX CONTRACTE COMERCIAL MUNDIAL', base: anyG ? 'Posterior a 1922' : 'Any de gravació no informat' };
  if (anyM > 0 && anyM <= (ANNO_ACTUAL - 80)) out.estat_composicio_sgae = { ok: true, text: '🟢 COMPOSICIÓ EN DOMINI PÚBLIC', base: 'Autor mort fa més de 80 anys (≤ ' + (ANNO_ACTUAL-80) + ')' };
  else out.estat_composicio_sgae = { ok: false, text: '🔴 COMPOSICIÓ PROTEGIDA (SGAE)', base: anyM ? 'Autor mort després de ' + (ANNO_ACTUAL-80) : 'Any de defunció no informat' };
  if (ovE === 'ok') out.estat_master_europa = { ok: true, text: '🟢 DOMINI PÚBLIC A EUROPA (manual)', base: c.override_nota || 'Override' };
  if (ovE === 'ko') out.estat_master_europa = { ok: false, text: '🔴 MÀSTER PROTEGIT (manual)', base: c.override_nota || 'Override' };
  if (ovM === 'ok') out.estat_master_mundial = { ok: true, text: '🟢 DOMINI PÚBLIC MUNDIAL (manual)', base: c.override_nota || 'Override' };
  if (ovM === 'ko') out.estat_master_mundial = { ok: false, text: '🔴 CONTRACTE COMERCIAL (manual)', base: c.override_nota || 'Override' };
  if (ovS === 'ok') out.estat_composicio_sgae = { ok: true, text: '🟢 COMPOSICIÓ LLIURE (manual)', base: c.override_nota || 'Override' };
  if (ovS === 'ko') out.estat_composicio_sgae = { ok: false, text: '🔴 COMPOSICIÓ PROTEGIDA (manual)', base: c.override_nota || 'Override' };
  const adq = c.adquisicio || 'cap';
  out.adquisicio = adq;
  out.adquisicio_ref = c.adquisicio_ref || '';
  out.adquisicio_data = c.adquisicio_data || '';
  out.adquisicio_import = Number(c.adquisicio_import) || 0;
  const adqResolta = ['negociada', 'pagada', 'cedida', 'no_necessari'].includes(adq);
  if (adqResolta) {
    const refTxt = (out.adquisicio_ref ? ' · Ref: ' + out.adquisicio_ref : '');
    if (!out.estat_master_europa.ok) out.estat_master_europa = { ok: true, text: '🟢 ADQUIRIT PER CONTRACTE', base: 'Adquisició: ' + adq + refTxt };
    if (!out.estat_master_mundial.ok) out.estat_master_mundial = { ok: true, text: '🟢 ADQUIRIT PER CONTRACTE', base: 'Adquisició: ' + adq + refTxt };
    if (!out.estat_composicio_sgae.ok) out.estat_composicio_sgae = { ok: true, text: '🟢 ADQUIRIT PER CONTRACTE', base: 'Adquisició: ' + adq + refTxt };
  }
  const masterOk = out.estat_master_mundial.ok || out.estat_master_europa.ok;
  const sgaeOk = out.estat_composicio_sgae.ok;
  if (adqResolta) out.accio_requerida = '✅ APTE: drets adquirits' + (out.adquisicio_ref ? ' (Ref: ' + out.adquisicio_ref + ')' : '') + '. Es pot integrar al muntatge.';
  else if (out.estat_master_mundial.ok && sgaeOk) out.accio_requerida = '✅ APTE: Integrar directament al muntatge.';
  else if (out.estat_master_europa.ok && !sgaeOk) out.accio_requerida = '⚠️ ATENCIÓ: Àudio lliure a Europa, però cal pagar SGAE.';
  else if (sgaeOk && !masterOk) out.accio_requerida = '⚠️ ATENCIÓ: Partitura lliure, però cal negociar el màster.';
  else out.accio_requerida = '❌ NEGOCIACIÓ COMERCIAL: Cal pressupost de Màster i Editorial.';
  if (c.override_nota && (ovE || ovM || ovS)) out.accio_requerida += '\n📝 Override: ' + c.override_nota;
  if (out.estat_master_mundial.ok && sgaeOk) out.color = 'ok';
  else if (adqResolta) out.color = 'ok';
  else if (!out.estat_master_europa.ok && !sgaeOk) out.color = 'ko';
  else out.color = 'warn';
  return out;
}

function textInformeAgregat(cancions) {
  const avui = new Date();
  const dataGen = avui.toLocaleDateString('ca-ES', { day: '2-digit', month: 'long', year: 'numeric' });
  const linia = '===========================================================';
  const liniaCurta = '-----------------------------------------------------------';
  let aptes=0,sgae=0,master=0,negociar=0,costTotal=0;
  cancions.forEach(c => {
    const d = calcularDiagnosticoLegal(c);
    if (d.estat_master_mundial.ok && d.estat_composicio_sgae.ok) aptes++;
    else if (d.estat_master_europa.ok && !d.estat_composicio_sgae.ok) sgae++;
    else if (d.estat_composicio_sgae.ok && !d.estat_master_europa.ok) master++;
    else negociar++;
    costTotal += Number(c.partida_presupuesto) || 0;
  });
  const cap = [
    linia, 'BADALONA COMUNICACIÓ · INFORME AGREGAT DE DRETS MUSICALS',
    'Documental "Darrere el drac"', linia,
    'Data: ' + dataGen, 'Total cançons: ' + cancions.length, '',
    'RESUM EXECUTIU', liniaCurta,
    '✅ Aptes: ' + aptes, '⚠️ Només SGAE: ' + sgae,
    '⚠️ Només màster: ' + master, '❌ Negociació completa: ' + negociar,
    'Cost total previst: ' + costTotal.toLocaleString('ca-ES') + ' €', '',
    'REFERÈNCIES', liniaCurta
  ];
  cancions.forEach((c,i) => {
    const d = calcularDiagnosticoLegal(c);
    let est = '❌';
    if (d.estat_master_mundial.ok && d.estat_composicio_sgae.ok) est = '✅';
    else if (d.estat_master_europa.ok && !d.estat_composicio_sgae.ok) est = '⚠️';
    cap.push(String(i+1).padStart(3,' ') + '. ' + (c.referencia || '—') + '  ' + (c.titulo||'') + '  (' + (c.ano_grabacion||'—') + ')  →  ' + est);
  });
  cap.push('');
  const fitxes = cancions.map((c,i) => '\n\n╔══════════════════════════════════════════════════════════╗\n║ FITXA ' + String(i+1).padStart(3,'0') + ' / ' + String(cancions.length).padStart(3,'0') + '\n╚══════════════════════════════════════════════════════════╝\n' + textInforme(c));
  return cap.concat(fitxes).join('\n');
}

function textResumAgregat(cancions) {

    costTotal += Number(c.partida_presupuesto) || 0;
  });
  const out = [
    linia, 'BADALONA COMUNICACIÓ · RESUM DE DRETS MUSICALS',
    'Documental "Darrere el drac"', linia,
    'Data: ' + avui.toLocaleDateString('ca-ES'),

    '⚠️ Només màster: ' + master, '❌ Negociació: ' + negociar,
    'Cost total: ' + costTotal.toLocaleString('ca-ES') + ' €', '',
    'LLISTAT', liniaCurta
  ];
  cancions.forEach((c,i) => {
    const d = calcularDiagnosticoLegal(c);
    let est = '❌';
    if (d.estat_master_mundial.ok && d.estat_composicio_sgae.ok) est = '✅';
    else if (d.estat_master_europa.ok && !d.estat_composicio_sgae.ok) est = '⚠️';
    out.push(String(i+1).padStart(3,' ') + '. ' + (c.referencia||'—') + '  ' + (c.titulo||'') + '  ' + est);

  return out.join('\n');

function novaCancion() {
  currentMR = { id:null, referencia: suggereixReferencia(), link_descarga:'', titulo:'', interprete:'', ano_grabacion:'', autor:'', ano_muerte_autor:'', partida_presupuesto:0, notas:'', override_europa:'', override_mundial:'', override_sgae:'', override_nota:'', adquisicio:'cap', adquisicio_ref:'', adquisicio_data:'', adquisicio_import:0, created_by: me };
  editingMR = true; render();
}
function suggereixReferencia() {
  const any = ANNO_ACTUAL;
  const nums = musicRights.map(x => x.referencia || '').filter(r => r.startsWith('BC-' + any + '-')).map(r => parseInt(r.split('-')[2]) || 0);
  return 'BC-' + any + '-' + String((nums.length ? Math.max.apply(null, nums) : 0) + 1).padStart(3, '0');
}
function obreCancion(c) { currentMR = JSON.parse(JSON.stringify(c)); editingMR = false; render(); }
function cancionsSeleccionades() { return musicRights.filter(c => seleccioMR.has(c.id)); }

async function desaCancion(c) {
  if (!c.titulo || !c.titulo.trim()) { alert('Cal indicar el títol.'); return; }
  const payload = {
    referencia: c.referencia || '', link_descarga: c.link_descarga || '', titulo: c.titulo || '',
    interprete: c.interprete || '', ano_grabacion: Number(c.ano_grabacion) || 0,
    autor: c.autor || '', ano_muerte_autor: Number(c.ano_muerte_autor) || 0,
    partida_presupuesto: Number(c.partida_presupuesto) || 0, notas: c.notas || '',
    override_europa: c.override_europa || '', override_mundial: c.override_mundial || '',
    override_sgae: c.override_sgae || '', override_nota: c.override_nota || '',
    adquisicio: c.adquisicio || 'cap', adquisicio_ref: c.adquisicio_ref || '',
    adquisicio_data: c.adquisicio_data || '', adquisicio_import: Number(c.adquisicio_import) || 0,
    updated_at: new Date().toISOString(), updated_by: me
  };
  if (c.id) {
    const r = await db.from('music_rights').update(payload).eq('id', c.id).select().single();
    if (r.error) { alert('Error: ' + r.error.message); return; }
    const i = musicRights.findIndex(x => x.id === c.id);
    if (i >= 0) musicRights[i] = r.data; else musicRights.unshift(r.data);
    currentMR = r.data;
  } else {
    payload.created_by = me;
    const r = await db.from('music_rights').insert(payload).select().single();
    if (r.error) { alert('Error: ' + r.error.message); return; }
    musicRights.unshift(r.data); currentMR = r.data;
  }
  editingMR = false;
}
async function esborraCancion(c) {
  if (!c.id) { currentMR = null; editingMR = false; render(); return; }
  if (!confirm('Esborrar "' + (c.titulo || '') + '"?')) return;
  const r = await db.from('music_rights').delete().eq('id', c.id);
  if (r.error) { alert('Error: ' + r.error.message); return; }
  musicRights = musicRights.filter(x => x.id !== c.id);
  seleccioMR.delete(c.id); currentMR = null; editingMR = false; render();
}

function descarregaTxt(text, filename) {
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

function classificaCobertura(cobertura, override) {
  const ov = (override || '').trim();
  if (ov === 'ok') return { estat: 'ok', text: '🟢 DOMINI PÚBLIC (override)', short: 'LLIURE' };
  if (ov === 'warn') return { estat: 'warn', text: '🟡 CC (override)', short: 'CC' };
  if (ov === 'ko') return { estat: 'ko', text: '🔴 PROTEGIT (override)', short: 'PROTEGIT' };
  if (ov === 'unk') return { estat: 'unk', text: '⚪ DESCONEGUT (override)', short: 'DESCONEGUT' };
  const c = (cobertura || '').toLowerCase().trim();
  if (!c) return { estat: 'unk', text: '⚪ DESCONEGUT', short: 'DESCONEGUT' };
  if (/publicdomain\/(mark|zero|certification)/i.test(cobertura) ||
      /\b(pdm 1\.0|cc0 1\.0|cc-0|cc 0|cczero)\b/i.test(c) ||
      /\b(domini públic|public domain|dominio público|gemeinfrei|domaine public)\b/i.test(c) ||
      /prelinger/i.test(c) ||
      /no copyright|sense drets|sin derechos|no rights reserved/i.test(c)) {
    return { estat: 'ok', text: '🟢 DOMINI PÚBLIC / LLIURE', short: 'LLIURE' };
  }
  if (/\b(cc[-\s]?by|creative commons|atribució|attribution)\b/i.test(c)) {
    return { estat: 'warn', text: '🟡 CREATIVE COMMONS (cal atribució)', short: 'CC' };
  }
  if (/\b(copyright|©|tots els drets|all rights reserved|protegit|amb drets|sota drets)\b/i.test(c)) {
    return { estat: 'ko', text: '🔴 PROTEGIT (requereix llicència)', short: 'PROTEGIT' };
  }
  return { estat: 'unk', text: '⚪ ' + cobertura.slice(0, 60), short: 'ALTRES' };
}

function filtraImatges() {
  const q = (filtreImg.text || '').toLowerCase().trim();
  return imageRights.filter(img => {
    if (filtreImg.cobertura !== 'totes') {
      const c = classificaCobertura(img.cobertura, img.override_cobertura).estat;
      if (c !== filtreImg.cobertura) return false;
    }
    if (filtreImg.estat !== 'tots' && (img.estat_intern || 'pendent') !== filtreImg.estat) return false;
    if (filtreImg.tipus !== 'tots' && (img.tipus || '') !== filtreImg.tipus) return false;
    if (!q) return true;
    const blob = [img.titol, img.autor, img.etiquetes, img.notes, img.link_procedencia, img.cobertura].filter(Boolean).join(' ').toLowerCase();
    return blob.includes(q);
  });
}

async function desaImatge(img) {
  if (!img.titol || !img.titol.trim()) { alert('Cal com a mínim el títol.'); return; }
  const payload = {
    titol: img.titol, link_procedencia: img.link_procedencia || '', cobertura: img.cobertura || '',
    any_data: img.any_data || '', tipus: img.tipus || '', autor: img.autor || '',
    notes: img.notes || '', estat_intern: img.estat_intern || 'pendent', etiquetes: img.etiquetes || '',
    override_cobertura: img.override_cobertura || '', override_nota: img.override_nota || '',
    vincle_tasca: img.vincle_tasca || '', vincle_seccio_id: img.vincle_seccio_id || '',
    updated_at: new Date().toISOString(), updated_by: me
  };
  if (img.id) {
    const r = await db.from('image_rights').update(payload).eq('id', img.id).select().single();
    if (r.error) { alert('Error: ' + r.error.message); return; }
    const i = imageRights.findIndex(x => x.id === img.id);
    if (i >= 0) imageRights[i] = r.data; else imageRights.unshift(r.data);
    currentImg = r.data;
  } else {
    payload.created_by = me;
    const r = await db.from('image_rights').insert(payload).select().single();
    if (r.error) { alert('Error: ' + r.error.message); return; }
    imageRights.unshift(r.data); currentImg = r.data;
  }
  editingImg = false;
}
async function esborraImatge(img) {
  if (!img.id) { currentImg = null; editingImg = false; render(); return; }
  if (!confirm('Esborrar "' + (img.titol || '') + '"?')) return;
  const r = await db.from('image_rights').delete().eq('id', img.id);
  if (r.error) { alert('Error: ' + r.error.message); return; }
  imageRights = imageRights.filter(x => x.id !== img.id);
  seleccioImg.delete(img.id); currentImg = null; editingImg = false; render();
}
function parsejaCSV(text) {
  const firstLine = text.split(/\r?\n/)[0] || '';
  let sep = ',';
  if (firstLine.includes('\t')) sep = '\t';
  else if (firstLine.split(';').length > firstLine.split(',').length) sep = ';';
  const linies = text.split(/\r?\n/).filter(l => l.trim() !== '');
  return linies.map(l => {
    const camps = []; let actual = ''; let dins = false;
    for (let i = 0; i < l.length; i++) {
      const ch = l[i];
      if (ch === '"' && !dins) { dins = true; continue; }
      if (ch === '"' && dins) { if (l[i+1] === '"') { actual += '"'; i++; } else dins = false; continue; }
      if (ch === sep && !dins) { camps.push(actual); actual = ''; continue; }
      actual += ch;
    }
    camps.push(actual);
    return camps.map(c => c.trim().replace(/^"|"$/g, ''));
  });
}
function normalitzaCapcalera(h) {
  const n = h.toLowerCase().trim().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '_');
  if (/titol|titulo|title/.test(n)) return 'titol';
  if (/link|url|font|proced|origen|source|enlace/.test(n)) return 'link_procedencia';
  if (/cobert|derech|right|copyright|llicencia|licencia|license/.test(n)) return 'cobertura';
  if (/any|ano|year|data|date|fecha/.test(n)) return 'any_data';
  if (/tipus|tipo|type/.test(n)) return 'tipus';
  if (/autor|author|fotograf|photograph|atribu/.test(n)) return 'autor';
  if (/notes|notas|observa/.test(n)) return 'notes';
  if (/etiquet|tag/.test(n)) return 'etiquetes';
  if (/estat|estado|status/.test(n)) return 'estat_intern';
  return null;
}
async function importaImatges(text) {
  if (!text || !text.trim()) { alert('Enganxa primer les files.'); return; }
  const files = parsejaCSV(text);
  if (files.length < 2) { alert('Cal capçalera + almenys una fila.'); return; }
  const capcalera = files[0].map(normalitzaCapcalera);
  if (!capcalera.includes('titol')) { alert('No s\'ha detectat la columna "títol". Revisa la capçalera.'); return; }
  const dades = [];
  for (let i = 1; i < files.length; i++) {
    const obj = { estat_intern: 'pendent', created_by: me, updated_by: me, updated_at: new Date().toISOString() };
    files[i].forEach((v, j) => { const k = capcalera[j]; if (k) obj[k] = v; });
    if (obj.titol && obj.titol.trim()) dades.push(obj);
  }
  if (!dades.length) { alert('Cap fila vàlida.'); return; }
  if (!confirm('Importar ' + dades.length + ' imatges? Aquesta acció no es pot desfer.')) return;
  const r = await db.from('image_rights').insert(dades).select();
  if (r.error) { alert('Error important: ' + r.error.message); return; }
  imageRights = (r.data || []).concat(imageRights);
  alert('✅ ' + r.data.length + ' imatges importades.');
  render();
}

function textInformeImatge(img) {
  const c = classificaCobertura(img.cobertura, img.override_cobertura);
  const linia = '===========================================================';
  const liniaCurta = '-----------------------------------------------------------';
  const avui = new Date();
  const camps = [];
  camps.push('Títol: "' + (img.titol || '—') + '"');
  if (img.autor) camps.push('Autor/Fotògraf: ' + img.autor);
  if (img.any_data) camps.push('Any/Data: ' + img.any_data);
  if (img.tipus) camps.push('Tipus: ' + img.tipus);
  if (img.link_procedencia) camps.push('Enllaç de procedència: ' + img.link_procedencia);
  if (img.estat_intern) camps.push('Estat intern: ' + img.estat_intern);
  const diag = [];
  diag.push('Classificació: ' + c.text);
  if (img.override_cobertura) diag.push('Override aplicat: ' + img.override_cobertura + (img.override_nota ? ' — ' + img.override_nota : ''));
  if (img.etiquetes) diag.push('Etiquetes: ' + img.etiquetes);
  if (img.notes) diag.push('Notes: ' + img.notes);
  if (img.vincle_tasca) diag.push('Vincle amb producció: ' + img.vincle_tasca);
  return [linia, 'BADALONA COMUNICACIÓ · CONTROL DE DRETS D\'IMATGE','Informe de cadena de drets (Chain of Title)', linia,'Data: ' + avui.toLocaleDateString('ca-ES', { day: '2-digit', month: 'long', year: 'numeric' }),'','DADES DE LA IMATGE', liniaCurta].concat(camps).concat(['','COBERTURA DECLARADA', liniaCurta, img.cobertura || '(no informat)','','DIAGNÒSTIC', liniaCurta]).concat(diag).join('\n');
}

function textInformeImatgesAgregat(imgs) {
  const linia = '===========================================================';
  const liniaCurta = '-----------------------------------------------------------';
  const avui = new Date();
  const cnt = { ok:0, warn:0, ko:0, unk:0 };
  imgs.forEach(i => { const c = classificaCobertura(i.cobertura, i.override_cobertura).estat; cnt[c] = (cnt[c]||0)+1; });
  const procedencia = {};
  imgs.forEach(i => { const arxiu = extrauArxiu(i.link_procedencia, i.cobertura) || 'Desconegut'; procedencia[arxiu] = (procedencia[arxiu] || 0) + 1; });
  const procedenciaOrdenada = Object.entries(procedencia).sort((a, b) => b[1] - a[1]);
  const out = [];
  out.push(linia, 'BADALONA COMUNICACIÓ · INFORME AGREGAT DE DRETS D\'IMATGE', 'Documental "Darrere el drac"', linia, 'Data: ' + avui.toLocaleDateString('ca-ES', { day: '2-digit', month: 'long', year: 'numeric' }), 'Total imatges: ' + imgs.length, '');

  out.push('1. RESUM EXECUTIU', liniaCurta, '🟢 Lliures: ' + cnt.ok, '🟡 CC (atribució): ' + cnt.warn, '🔴 Protegides: ' + cnt.ko, '⚪ Desconegudes: ' + cnt.unk, '');

  procedenciaOrdenada.forEach(([arxiu, n]) => { const punts = '.'.repeat(Math.max(2, 40 - arxiu.length)); out.push('  ' + arxiu + ' ' + punts + ' ' + n + (n === 1 ? ' imatge' : ' imatges')); });
  out.push('', '  Total: ' + imgs.length + ' imatges.');
  if (cnt.unk === 0) out.push('  Totes les imatges amb llicència coneguda són de domini públic o equivalent (CC0 / PDM 1.0).');
  out.push('', '4. LLISTAT DE REFERÈNCIES', liniaCurta);
  imgs.forEach((img, i) => { const c = classificaCobertura(img.cobertura, img.override_cobertura); out.push(String(i+1).padStart(3,' ') + '. ' + (img.titol || '—') + '  (' + (img.any_data || '—') + ')  →  ' + c.short); });
  out.push('', '5. FITXES INDIVIDUALS', liniaCurta);
  imgs.forEach((img, i) => { out.push('', '╔══════════════════════════════════════════════════════════╗', '║ FITXA ' + String(i+1).padStart(3,'0') + ' / ' + String(imgs.length).padStart(3,'0'), '╚══════════════════════════════════════════════════════════╝', textInformeImatge(img)); });
  return out.join('\n');
}

  const out = [linia, 'BADALONA COMUNICACIÓ · RESUM DE DRETS D\'IMATGE','Documental "Darrere el drac"', linia,'Data: ' + avui.toLocaleDateString('ca-ES'),'Total imatges: ' + imgs.length, '','RESUM PER COBERTURA', liniaCurta,'🟢 Lliures: ' + cnt.ok,'🟡 CC: ' + cnt.warn,'🔴 Protegides: ' + cnt.ko,'⚪ Desconegudes: ' + cnt.unk, '','RESUM PER ESTAT INTERN', liniaCurta];

function textCreditsFinals() {
  const blocs = [];
  const textTec = textCreditsTecnics();
  if (textTec) blocs.push(textTec.trim());
  const imatgesAprovades = credits.filter(c => c.tipus === 'imatge');
  if (imatgesAprovades.length) {
    const arxius = new Set(); const autors = new Set();
    imatgesAprovades.forEach(c => {
      const a = (c.arxiu || '').trim(); if (a) arxius.add(a);
      const atr = (c.atribucio || '').trim();
      if (atr && !/^an[òo]nim$/i.test(atr)) atr.split(/\s*,\s*/).forEach(x => { const net = x.trim(); if (net && !/^an[òo]nim$/i.test(net)) autors.add(net); });
    });
    const arxiusOrdenats = Array.from(arxius).sort((a, b) => a.localeCompare(b, 'ca'));
    const arxiusSet = new Set(arxiusOrdenats.map(a => a.toLowerCase()));
    const autorsFiltrats = Array.from(autors).filter(a => !arxiusSet.has(a.toLowerCase())).sort((a, b) => a.localeCompare(b, 'ca'));
    const llista = arxiusOrdenats.concat(autorsFiltrats);
    const bloc = []; bloc.push(creditFraseImatges); bloc.push(''); llista.forEach(a => bloc.push('  ' + a)); blocs.push(bloc.join('\n'));
  }
  const musicaAprovada = credits.filter(c => c.tipus === 'musica');
  if (musicaAprovada.length) {
    const bloc = []; bloc.push(creditFraseMusica); bloc.push('');
    musicaAprovada.forEach(c => { const parts = []; if (c.titol) parts.push(c.titol); if (c.atribucio) parts.push(c.atribucio); if (c.any_text) parts.push(c.any_text); if (c.arxiu) parts.push(c.arxiu); if (parts.length) bloc.push('  ' + parts.join(' — ')); });
    blocs.push(bloc.join('\n'));
  }
  if (!blocs.length) return '(sense crèdits)';
  return blocs.join('\n\n\n');
}
function textCreditsTecnics() {
  if (!creditsTecnics.length) return '';
  const grups = {};
  creditsTecnics.forEach(c => { const cat = (c.categoria || 'Altres').trim(); if (!grups[cat]) grups[cat] = []; grups[cat].push(c); });
  const cats = Object.keys(grups).sort(); const linies = [];
  cats.forEach(cat => { linies.push(cat + ':'); grups[cat].forEach(c => linies.push('  ' + (c.nom || '—'))); linies.push(''); });
  return linies.join('\n').trim();
}
function extrauArxiu(url, llicencia) {
  const llic = (llicencia || '').toLowerCase();
  if (/prelinger/i.test(llic)) return 'Prelinger Archives';
  if (/eye filmmuseum/i.test(llic)) return 'Eye Filmmuseum';
  if (/national archives/i.test(llic)) return 'National Archives';
  if (/musée albert-kahn|musee albert-kahn/i.test(llic)) return 'Musée Albert-Kahn';
  if (!url) return '';
  try {
    const u = new URL(url); const h = u.hostname.replace(/^www\./, '');
    const map = { 'commons.wikimedia.org': 'Wikimedia Commons','upload.wikimedia.org': 'Wikimedia Commons','archive.org': 'Internet Archive','bne.es': 'Biblioteca Nacional de España','bdh.bne.es': 'Biblioteca Digital Hispánica (BNE)','europeana.eu': 'Europeana','loc.gov': 'Library of Congress','flickr.com': 'Flickr Commons','youtube.com': 'YouTube','vimeo.com': 'Vimeo' };
    for (const k in map) if (h.includes(k)) return map[k];
    return h;
  } catch(e) { return ''; }
}

  else out.push('(cap crèdit tècnic)');

async function importaCreditsTecnics() {
  const text = prompt('Enganxa les files del teu Excel/CSV (amb capçalera CATEGORIA | NOM | ORDRE):', '');
  if (!text || !text.trim()) return;
  const files = parsejaCSV(text);
  if (files.length < 2) { alert('Cal capçalera + almenys una fila.'); return; }
  const capcalera = files[0].map(h => { const n = h.toLowerCase().trim().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '_'); if (/categor|seccion/.test(n)) return 'categoria'; if (/nom|nombre|name/.test(n)) return 'nom'; if (/ordre|orden|order|pos/.test(n)) return 'ordre'; return null; });
  const dades = [];
  for (let i = 1; i < files.length; i++) { const obj = { created_by: me, updated_at: new Date().toISOString() }; files[i].forEach((v, j) => { const k = capcalera[j]; if (k) obj[k] = v; }); if (obj.nom && obj.nom.trim()) dades.push(obj); }
  if (!dades.length) { alert('Cap fila vàlida.'); return; }
  if (!confirm('Importar ' + dades.length + ' línies de crèdits tècnics?')) return;
  const r = await db.from('credits_tecnics').insert(dades).select();
  if (r.error) { alert('Error important: ' + r.error.message); return; }
  creditsTecnics = creditsTecnics.concat(r.data);
  alert('✅ ' + r.data.length + ' línies importades.');
  render();
}

  if (!confirm('Afegir ' + nous.length + ' crèdits nous?\n\n' + nous.filter(n => n.tipus === 'imatge').length + ' d\'imatges\n' + nous.filter(n => n.tipus === 'musica').length + ' de música')) return;

  addGrup('📋 Tasques', r.tasques, (x) => goto(x.seccio.id), (x) => ({ title: x.tasca.t || '(sense títol)', meta: [x.seccio.name, x.tasca.d ? fmt(x.tasca.d) : 'Sense data'].filter(Boolean).join(' · ') }));

    if (typeof p.pos !== 'number') { p.pos = i; calDesar = true; }
    if (!Array.isArray(p.jornades)) { p.jornades = []; calDesar = true; }
    if (!Array.isArray(p.dietes)) { p.dietes = []; calDesar = true; }
    p.jornades.forEach(j => {
      if (!Array.isArray(j.persones_noms)) {
        j.persones_noms = Number(j.persones) > 0
          ? Array(Number(j.persones)).fill('?').map((_, k) => 'Persona ' + (k+1))
          : [];
        delete j.persones;
        calDesar = true;
      }
      if (typeof j.es_laborable !== 'boolean') { j.es_laborable = true; calDesar = true; }
    });
    if (typeof p.admet_jornades !== 'boolean') { p.admet_jornades = PARTIDES_AMB_JORNADES.test(p.c || ''); calDesar = true; }
    if (typeof p.admet_dietes !== 'boolean') { p.admet_dietes = PARTIDES_AMB_DIETES.test(p.c || ''); calDesar = true; }
  });
  s.budget.sort((a, b) => (a.pos || 0) - (b.pos || 0));

  const dSoundtrack = calculaDretsSoundtrack();

              cbC.addEventListener('change', () => { j.cobrat = cbC.checked; save(s); render(); });
              if (j.cobrat && !editing) jrow.append(el('div', { style: 'text-align:center;font-size:16px', title: 'Cobrat', textContent: '✅' }));
              else jrow.append(el('div', { style: 'text-align:center' }, cbC));

              jrow.append(el('div', { style: 'text-align:center' }, editing ? el('button', { class: 'x', textContent: '×', onclick: () => { if (!confirm('Esborrar aquesta jornada?')) return; p.jornades = p.jornades.filter(x => x !== j); save(s); render(); } }) : ''));

              const badgeRow = el('div', { style: 'grid-column:1/-1;padding:2px 0 4px 6px;font-size:11px;' + (j.cobrat ? 'color:var(--ok)' : 'color:var(--warn)') });
              if (tipusCalc === 'fora_de_rang') { badgeRow.textContent = '❌ Les hores indicades no compleixen el quadre legal per a aquest tipus de dia.'; badgeRow.style.color = 'var(--err)'; }
              else if (tipusCalc) { badgeRow.textContent = ETIQ_JORNADA[tipusCalc] + ' (' + (j.es_laborable !== false ? 'laborable' : 'no laborable') + ') · ' + (j.cobrat ? '🟢 Cobrat' : '🟡 Pendent de cobrar'); }
              else { badgeRow.textContent = '⚠️ Introdueix les hores per calcular la compensació.'; }
              taula.append(jrow);
              taula.append(badgeRow);
            });

            const tMes = totalMes(arr), cMes = cobratMes(arr), pMes = pendentMes(arr);
            const resumMes = el('div', { style: 'margin-top:10px;padding:10px 12px;background:var(--card);border:1px solid var(--bd);border-radius:8px;font-size:13px;display:grid;grid-template-columns:1fr auto;gap:4px 16px' });
            resumMes.append(
              el('span', { textContent: 'Total mes', style: 'font-weight:600' }), el('span', { textContent: eur(tMes), style: 'text-align:right;font-weight:700' }),
              el('span', { textContent: '├─ Cobrat (suma al Real)', style: 'color:var(--ok)' }), el('span', { textContent: eur(cMes), style: 'text-align:right;color:var(--ok);font-weight:600' }),
              el('span', { textContent: '└─ Pendent de cobrar', style: 'color:var(--warn)' }), el('span', { textContent: eur(pMes), style: 'text-align:right;color:var(--warn);font-weight:600' })
            );
            taula.append(resumMes);

            if (editing) {
              taula.append(el('div', { class: 'row', style: 'margin-top:6px' },
                el('button', { class: 'btn s', textContent: '+ Afegir jornada', onclick: () => {
                  const dataDefault = (mk && mk !== 'sense-data') ? (mk + '-' + String(new Date().getDate()).padStart(2, '0')) : avuiISO();
                  p.jornades = p.jornades || [];
                  p.jornades.push({ id: 'j' + Date.now().toString(36), data: dataDefault, hores: 2, es_laborable: true, persones_noms: [], concepte: '', cobrat: false });
                  openMes[idx] = openMes[idx] || {};
                  openMes[idx][mk] = true;
                  save(s); render();
                } })
              ));
            }
            jbox.append(taula);
          }
        });

        if (editing) {
          jbox.append(el('div', { class: 'row', style: 'margin-top:8px' },
            el('button', { class: 'btn s', textContent: '+ Nova jornada en un altre mes', onclick: () => {
              const ara = new Date();
              const valor = prompt('Mes (YYYY-MM):', ara.getFullYear() + '-' + String(ara.getMonth() + 1).padStart(2, '0'));
              if (!valor || !/^\d{4}-\d{2}$/.test(valor)) return;
              p.jornades = p.jornades || [];
              p.jornades.push({ id: 'j' + Date.now().toString(36), data: valor + '-01', hores: 2, es_laborable: true, perssones_noms: [], concepte: '', cobrat: false });
              openMes[idx] = openMes[idx] || {};
              openMes[idx][valor] = true;
              save(s); render();
            } })
          ));
        }
        jbox.append(el('div', { class: 'badge', style: 'margin-top:6px', textContent: 'Les jornades cobrades sumen al Real. Les pendents es mostren però no sumen.' }));
        list.append(jbox);
      }
    }
  });

  wrap.append(list);

  const totalP = s.budget.reduce((a, p) => a + (Number(p.p) || 0), 0);
  const totalR = s.budget.reduce((a, p) => {
    let base = realOf(p);
    if (/soundtrack/i.test(p.c || '') && dSoundtrack.existeix && dSoundtrack.pagat > 0) base += dSoundtrack.pagat;
    return a + base;
  }, 0);

  const pendentsJorn = s.budget.reduce((a, p) => a + pendentJornadesOf(p), 0);
  const pendentsDietes = s.budget.reduce((a, p) => a + pendentDietesOf(p), 0);
  const pendentsSoundtrack = dSoundtrack.existeix ? dSoundtrack.pendent : 0;
  const totalPendent = pendentsJorn + pendentsDietes + pendentsSoundtrack;
  const totalRealComplert = totalR + totalPendent;
  const diff = totalRealComplert - totalP;

  const sum = el('div', { class: 'summary', style: 'margin-top:16px;padding-top:14px;border-top:2px solid var(--bd)' });
  sum.append(el('div', { class: 'lbl' }, [el('div', { textContent: 'Total previst' }), el('div', { class: 'badge', style: 'font-size:10px;font-weight:normal;margin-top:-2px', textContent: 'El que teníeu pensat gastar.' })]));
  sum.append(el('div', { class: 'val big', textContent: eur(totalP) }));
  sum.append(el('div', { class: 'lbl' }, [el('div', { textContent: 'Total real' }), el('div', { class: 'badge', style: 'font-size:10px;font-weight:normal;margin-top:-2px', textContent: 'El que heu pagat + el que teniu compromès a pagar.' })]));
  sum.append(el('div', { class: 'val big', textContent: eur(totalRealComplert) }));
  if (totalPendent > 0) {
    sum.append(el('div', { class: 'lbl' }, [el('div', { textContent: '├─ Del qual, pendent de pagar/cobrar' }), el('div', { class: 'badge', style: 'font-size:10px;font-weight:normal;margin-top:-2px', textContent: 'Jornades, dietes i drets (Soundtrack) encara per tancar.' })]));
    sum.append(el('div', { class: 'val', style: 'color:var(--warn);font-weight:700', textContent: eur(totalPendent) }));
    if (pendentsJorn > 0) { sum.append(el('div', { class: 'lbl', style: 'padding-left:14px' }, [el('div', { textContent: '· Jornades pendents' })])); sum.append(el('div', { class: 'val', style: 'color:var(--warn)', textContent: eur(pendentsJorn) })); }
    if (pendentsDietes > 0) { sum.append(el('div', { class: 'lbl', style: 'padding-left:14px' }, [el('div', { textContent: '· Dietes pendents' })])); sum.append(el('div', { class: 'val', style: 'color:var(--warn)', textContent: eur(pendentsDietes) })); }
    if (pendentsSoundtrack > 0) { sum.append(el('div', { class: 'lbl', style: 'padding-left:14px' }, [el('div', { textContent: '· Drets Soundtrack pendents' })])); sum.append(el('div', { class: 'val', style: 'color:var(--warn)', textContent: eur(pendentsSoundtrack) })); }
  }
  sum.append(el('div', { class: 'lbl' }, [el('div', { textContent: 'Diferència' }), el('div', { class: 'badge', style: 'font-size:10px;font-weight:normal;margin-top:-2px', textContent: 'Marge restant respecte al previst.' })]));
  sum.append(el('div', { class: 'val big ' + (diff > 0 ? 'pos' : diff < 0 ? 'neg' : ''), textContent: (diff > 0 ? '+' : '') + eur(diff) }));

  wrap.append(sum);
  return wrap;
}

/* ============================================================
   BLOC DIETES dins del pressupost (com les jornades especials)
   ============================================================ */
function renderBlocDietes(s, p, idx) {
  const dbox = el('div', { class: 'diet-box' });
  dbox.append(el('h4', { class: 'diet-title', textContent: '🍽️ Dietes' }));

  const grups = agrupaDietesPerMes(p.dietes);
  const keys = ordenaMesos(Object.keys(grups));
  const totalPartida = keys.reduce((a, k) => a + totalDietesMes(grups[k]), 0);
  const cobratPartida = keys.reduce((a, k) => a + cobratDietesMes(grups[k]), 0);
  const pendentPartida = totalPartida - cobratPartida;

  if (totalPartida > 0) {
    dbox.append(el('div', { class: 'diet-summary' }, [
      el('span', { textContent: 'Total dietes: ' + eur(totalPartida) }),
      el('span', { class: 'diet-cobrat', textContent: 'Cobrat: ' + eur(cobratPartida) }),
      el('span', { class: 'diet-pendent', textContent: 'Pendent: ' + eur(pendentPartida) })
    ]));
  }
  if (!keys.length) dbox.append(el('div', { class: 'badge', textContent: 'Cap dieta encara.' }));

  keys.forEach(mk => {
    const arr = grups[mk];
    const any = Number(mk.split('-')[0]);
    const mes = Number(mk.split('-')[1]);
    const tM = totalDietesMes(arr), cM = cobratDietesMes(arr), pM = pendentDietesMes(arr);
    const nD = arr.length;
    const obert = !!(openDietMes[idx] && openDietMes[idx][mk]);
    const titol = (arr[0] && arr[0].__titolMes) || nomMesDieta(mk);

    const header = el('div', { class: 'diet-mes-head' });
    header.append(el('span', { class: 'diet-caret', textContent: obert ? '▼' : '▶', onclick: () => { openDietMes[idx] = openDietMes[idx] || {}; openDietMes[idx][mk] = !obert; render(); } }));
    const inpTitol = el('input', { type: 'text', class: 'diet-titol-input', value: titol, title: 'Títol editable del mes' });
    inpTitol.addEventListener('change', async () => {
      const nou = inpTitol.value.trim();
      if (!nou) { inpTitol.value = titol; return; }
      await desaDietaMes(any, mes, nou);
      arr.forEach(d => { d.__titolMes = nou; });
      save(s); render();
    });
    header.append(inpTitol);
    header.append(el('span', { class: 'diet-mes-count', textContent: '(' + nD + ' dieta' + (nD === 1 ? '' : 'es') + ')' }));
    header.append(el('span', { class: 'diet-mes-total', textContent: eur(tM) }));
    if (pM === 0) header.append(el('span', { style: 'color:var(--ok);font-weight:600;font-size:12px', textContent: '🟢 Cobrat' }));
    else header.append(el('span', { style: 'color:var(--warn);font-weight:600;font-size:12px', textContent: '🟡 ' + eur(pM) + ' pendent' }));
    if (pM > 0) {
      header.append(el('button', { class: 'btn s', textContent: '✅ Cobrar totes', onclick: async () => {
        if (!confirm('Marcar com a cobrades ' + arr.filter(d => d.estat !== 'cobrat').length + ' dietes pendents de ' + nomMesDieta(mk) + '?')) return;
        arr.forEach(d => { if (d.estat !== 'cobrat') d.estat = 'cobrat'; });
        save(s); render();
      } }));
    }
    if (editing) {
      header.append(el('button', { class: 'btn s', textContent: '＋', title: 'Afegir dieta en aquest mes', onclick: () => { p.dietes = p.dietes || []; p.dietes.push({ id: 'd' + Date.now().toString(36), data: (mk && mk !== 'sense-data' ? mk + '-' + String(new Date().getDate()).padStart(2,'0') : avuiISO()), persona:'', concepte:'', tipus:'apat', import:0, km:0, preu_km:DIETES_PREU_KM_DEFECTE, estat:'pendent', notes:'', __titolMes: titol }); openDietMes[idx] = openDietMes[idx] || {}; openDietMes[idx][mk] = true; save(s); render(); } }));
    }
    dbox.append(header);

    if (obert) {
      const taula = el('div', { class: 'diet-taula' });
      taula.append(el('div', { class: 'diet-row diet-head' }, [
        el('div', { textContent: 'Data' }),
        el('div', { textContent: 'Persona' }),
        el('div', { textContent: 'Concepte' }),
        el('div', { textContent: 'Tipus' }),
        el('div', { class: 'diet-num', textContent: 'Import' }),
        el('div', { textContent: 'Notes' }),
        el('div', { textContent: 'Estat' }),
        el('div')
      ]));
      arr.forEach(d => {
        const row = el('div', { class: 'diet-row' + (d.estat === 'cobrat' ? ' done' : '') });
        const inpData = el('input', { type: 'date', value: d.data || '' }); inpData.disabled = !editing;
        inpData.addEventListener('change', () => { d.data = inpData.value; save(s); render(); });
        row.append(el('div', {}, inpData));
        const inpPers = el('input', { type: 'text', value: d.persona || '', placeholder: 'Joan, David...' }); inpPers.disabled = !editing;
        inpPers.addEventListener('input', () => { d.persona = inpPers.value; save(s); });
        row.append(el('div', {}, inpPers));
        const inpConc = el('input', { type: 'text', value: d.concepte || '', placeholder: 'Dinar, tren...' }); inpConc.disabled = !editing;
        inpConc.addEventListener('input', () => { d.concepte = inpConc.value; save(s); });
        row.append(el('div', {}, inpConc));
        const selTipus = el('select', {}, TIPUS_DIETA.map(([v,l]) => el('option', { value: v, textContent: l, selected: (d.tipus || 'apat') === v })));
        selTipus.disabled = !editing;
        selTipus.addEventListener('change', () => { d.tipus = selTipus.value; save(s); render(); });
        row.append(el('div', {}, selTipus));
        if (d.tipus === 'quilometratge') {
          const wrapKm = el('div', { style: 'display:flex;gap:4px;align-items:center' });
          const inpKm = el('input', { type: 'number', value: d.km || 0, min: 0, step: '0.1', style: 'width:70px' }); inpKm.disabled = !editing;
          inpKm.addEventListener('input', () => { d.km = Number(inpKm.value) || 0; d.import = (Number(d.km) || 0) * (Number(d.preu_km) || DIETES_PREU_KM_DEFECTE); save(s); render(); });
          const inpPreu = el('input', { type: 'number', value: d.preu_km || DIETES_PREU_KM_DEFECTE, min: 0, step: '0.01', style: 'width:70px' }); inpPreu.disabled = !editing;
          inpPreu.addEventListener('input', () => { d.preu_km = Number(inpPreu.value) || 0; d.import = (Number(d.km) || 0) * (Number(d.preu_km) || DIETES_PREU_KM_DEFECTE); save(s); render(); });
          wrapKm.append(inpKm, el('span', { textContent: '×', style: 'font-size:11px' }), inpPreu);
          row.append(el('div', {}, wrapKm));
        } else {
          const inpImport = el('input', { type: 'number', value: d.import || 0, min: 0, step: '0.01', style: 'width:90px;text-align:right' }); inpImport.disabled = !editing;
          inpImport.addEventListener('input', () => { d.import = Number(inpImport.value) || 0; save(s); render(); });
          row.append(el('div', { class: 'diet-num' }, inpImport));
        }
        const inpNotes = el('input', { type: 'text', value: d.notes || '', placeholder: 'Notes...' }); inpNotes.disabled = !editing;
        inpNotes.addEventListener('input', () => { d.notes = inpNotes.value; save(s); });
        row.append(el('div', {}, inpNotes));
        const cbEstat = el('input', { type: 'checkbox', checked: d.estat === 'cobrat' }); cbEstat.disabled = !editing;
        cbEstat.addEventListener('change', () => { d.estat = cbEstat.checked ? 'cobrat' : 'pendent'; save(s); render(); });
        row.append(el('div', { style: 'text-align:center;font-size:13px' }, cbEstat));
        row.append(el('div', { style: 'text-align:center' }, editing ? el('button', { class: 'x', textContent: '×', onclick: () => { if (!confirm('Esborrar aquesta dieta?')) return; p.dietes = p.dietes.filter(x => x !== d); save(s); render(); } }) : ''));
        taula.append(row);
        const importCalc = d.tipus === 'quilometratge' ? (Number(d.km)||0)*(Number(d.preu_km)||DIETES_PREU_KM_DEFECTE) : (Number(d.import)||0);
        taula.append(el('div', { style: 'grid-column:1/-1;font-size:11px;color:var(--mut);padding:0 0 4px 6px' }, [
          el('span', { textContent: '💰 ' + eur(importCalc) + (d.estat === 'cobrat' ? ' · 🟢 Cobrat' : ' · 🟡 Pendent') })
        ]));
      });
      const resumMes = el('div', { style: 'margin-top:10px;padding:10px 12px;background:var(--card);border:1px solid var(--bd);border-radius:8px;font-size:13px;display:grid;grid-template-columns:1fr auto;gap:4px 16px' });
      resumMes.append(
        el('span', { textContent: 'Total mes', style: 'font-weight:600' }), el('span', { textContent: eur(tM), style: 'text-align:right;font-weight:700' }),
        el('span', { textContent: '├─ Cobrat (suma al Real)', style: 'color:var(--ok)' }), el('span', { textContent: eur(cM), style: 'text-align:right;color:var(--ok);font-weight:600' }),
        el('span', { textContent: '└─ Pendent de cobrar', style: 'color:var(--warn)' }), el('span', { textContent: eur(pM), style: 'text-align:right;color:var(--warn);font-weight:600' })
      );
      taula.append(resumMes);
      dbox.append(taula);
    }
  });

  if (editing) {
    dbox.append(el('div', { class: 'row', style: 'margin-top:8px' },
      el('button', { class: 'btn s', textContent: '+ Nova dieta en un altre mes', onclick: () => {
        const ara = new Date();
        const valor = prompt('Mes (YYYY-MM):', ara.getFullYear() + '-' + String(ara.getMonth() + 1).padStart(2, '0'));
        if (!valor || !/^\d{4}-\d{2}$/.test(valor)) return;
        p.dietes = p.dietes || [];
        p.dietes.push({ id: 'd' + Date.now().toString(36), data: valor + '-01', persona:'', concepte:'', tipus:'apat', import:0, km:0, preu_km:DIETES_PREU_KM_DEFECTE, estat:'pendent', notes:'', __titolMes: nomMesDieta(valor) });
        openDietMes[idx] = openDietMes[idx] || {};
        openDietMes[idx][valor] = true;
        save(s); render();
      } })
    ));
  }
  dbox.append(el('div', { class: 'badge', style: 'margin-top:6px', textContent: 'Les dietes cobrades sumen al Real. Les pendents es mostren com a badge a la partida. Les de transport/quilometratge també surten al calendari i al gantt.' }));
  return dbox;
}

async function start(user) {
  me = user.email;
  $('#login').hidden = true; $('#ui').hidden = false;
  const a = await db.from('sections').select('*').order('pos');
  if (a.error) { alert('Error carregant dades.'); return; }
  secs = a.data || [];
  const b = await db.from('settings').select('people, credit_frase_imatges, credit_frase_musica').eq('id', 1).maybeSingle();
  if (b.data) {
    if (Array.isArray(b.data.people) && b.data.people.length) people = b.data.people.map(p => typeof p === 'string' ? { name: p, email: '' } : p);
    if (b.data.credit_frase_imatges) creditFraseImatges = b.data.credit_frase_imatges;
    if (b.data.credit_frase_musica) creditFraseMusica = b.data.credit_frase_musica;
  }
  await carregaBlocks();
  await carregaDocs();
  await carregaMusicRights();
  await carregaImageRights();
  await carregaCredits();
  await carregaCreditsTecnics();
  await carregaDietes();
  await carregaDietesMesos();
  cur = 'cal'; render();
  inicialitzaCercador();
  db.channel('canvis')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'sections' }, p => {
      if (p.eventType === 'DELETE') secs = secs.filter(x => x.id !== p.old.id);
      else { if (p.new.id === cur && busy()) return; const i = secs.findIndex(x => x.id === p.new.id); if (i < 0) secs.push(p.new); else Object.assign(secs[i], p.new); }
      secs.sort((x, y) => x.pos - y.pos);
      if (!busy()) render(); else paintNav();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'settings' }, p => {
      if (p.new && p.new.people) people = (Array.isArray(p.new.people) ? p.new.people : []).map(x => typeof x === 'string' ? { name: x, email: '' } : x);
      if (p.new && p.new.credit_frase_imatges) creditFraseImatges = p.new.credit_frase_imatges;
      if (p.new && p.new.credit_frase_musica) creditFraseMusica = p.new.credit_frase_musica;
      if (!busy()) render();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'blocks' }, async () => { await carregaBlocks(); if (cur === 'cal' && !busy()) render(); })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'music_rights' }, async () => { await carregaMusicRights(); if (cur === 'drets' && !busy()) render(); })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'image_rights' }, async () => { await carregaImageRights(); if (cur === 'imatges' && !busy()) render(); })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'credits' }, async () => { await carregaCredits(); if (cur === 'credits' && !busy()) render(); })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'credits_tecnics' }, async () => { await carregaCreditsTecnics(); if (cur === 'credits' && !busy()) render(); })
    .subscribe();
  pch = db.channel('presencia', { config: { presence: { key: me } } });
  pch.on('presence', { event: 'sync' }, () => { peers = pch.presenceState(); paintNav(); }).subscribe(st => { if (st === 'SUBSCRIBED') pch.track({ sec: cur }); });
}

$('#go').onclick = async () => {
  const r = await db.auth.signInWithPassword({ email: $('#em').value.trim(), password: $('#pw').value });
  if (r.error) $('#err').textContent = 'Correu o contrasenya incorrectes.';
  else start(r.data.user);
};
$('#out').onclick = async () => { await db.auth.signOut(); location.reload(); };
(async () => {
  const { data } = await db.auth.getSession();
  if (data.session) start(data.session.user); else $('#login').hidden = false;
})();
